[build]
  command = "node build.js"
  publish = "public"
  functions = "functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]
  included_files = ["functions/data/**"]

[dev]
  port = 8080
  functionsPort = 3001

[functions."po-notify-recover"]
  schedule = "*/5 * * * *"
