<div class="page-header d-flex justify-content-between align-items-center">
  <div>
    <h4 class="mb-0"><i class="bi bi-droplet-fill me-2" style="color:var(--claude-primary)"></i>ตั้งค่าโปรแกรมน้ำมันเครื่อง</h4>
    <div class="text-muted small mt-1">กำหนดรายการอะไหล่สำหรับแต่ละทะเบียนและโปรแกรม</div>
  </div>
</div>

<!-- ── เลือกรถ + โปรแกรม ── -->
<div class="card mb-3">
  <div class="card-body">
    <div class="row g-3 align-items-end">

      <div class="col-sm-4">
        <label class="form-label small fw-semibold">
          <i class="bi bi-bus-front me-1"></i>ทะเบียนรถ
        </label>
        <select id="oilPlateSelect" class="form-select form-select-sm"
          onchange="onOilPlateChange()">
          <option value="">-- เลือกทะเบียน --</option>
        </select>
      </div>

      <div class="col-sm-3">
        <label class="form-label small fw-semibold">
          <i class="bi bi-droplet me-1"></i>โปรแกรม
        </label>
        <select id="oilProgramSelect" class="form-select form-select-sm">
          <option value="">-- เลือกโปรแกรม --</option>
          <option value="S">S — รายการสั้น</option>
          <option value="M">M — รายการกลาง</option>
          <option value="S2">S2 — รายการพิเศษ</option>
          <option value="L">L — รายการเต็ม</option>
        </select>
      </div>

      <div class="col-sm-2">
        <button class="btn btn-primary btn-sm w-100"
          onclick="loadOilTemplateItems()">
          <i class="bi bi-search me-1"></i>โหลดรายการ
        </button>
      </div>

      <div class="col-sm-3">
        <div id="oilExistingPrograms" class="d-none">
          <label class="form-label small fw-semibold text-muted">
            โปรแกรมที่ตั้งค่าแล้ว
          </label>
          <div id="oilExistingProgramBadges" class="d-flex gap-1 flex-wrap"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ── ตารางรายการอะไหล่ ── -->
<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center py-2">
    <div class="fw-semibold" style="font-size:14px">
      <i class="bi bi-list-ul me-1"></i>
      รายการอะไหล่
      <span id="oilTemplateInfo" class="text-muted fw-normal ms-2" style="font-size:12px"></span>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary btn-sm" onclick="openOilPartPicker()">
        <i class="bi bi-plus-lg me-1"></i>เพิ่มรายการ
      </button>
      <button class="btn btn-success btn-sm" onclick="saveOilTemplate()">
        <i class="bi bi-save me-1"></i>บันทึก
      </button>
    </div>
  </div>

  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-sm table-hover mb-0">
        <thead style="background:var(--claude-secondary);color:#fff">
          <tr>
            <th style="width:40px;text-align:center">#</th>
            <th>ชื่ออะไหล่</th>
            <th style="width:90px;text-align:center">จำนวน</th>
            <th style="width:80px;text-align:center">หน่วย</th>
            <th style="width:110px;text-align:center">ราคา/หน่วย</th>
            <th style="width:80px;text-align:center">รวม</th>
            <th style="width:50px"></th>
          </tr>
        </thead>
        <tbody id="oilTemplateBody">
          <tr>
            <td colspan="7" class="text-center text-muted py-5">
              <i class="bi bi-droplet" style="font-size:2rem;opacity:0.3;display:block;margin-bottom:8px"></i>
              เลือกทะเบียนและโปรแกรม แล้วกด "โหลดรายการ"
            </td>
          </tr>
        </tbody>
        <tfoot id="oilTemplateFoot" class="d-none">
          <tr style="background:var(--claude-surface)">
            <td colspan="5" class="text-end fw-semibold pe-3" style="font-size:13px">
              ราคารวมโดยประมาณ
            </td>
            <td class="fw-bold text-end" style="color:var(--claude-primary);font-size:13px">
              <span id="oilTemplateTotal">0.00</span>
            </td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>
</div>
