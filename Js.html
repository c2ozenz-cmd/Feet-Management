<script>
// ============================================================
// Js.html — Bus Repair System Frontend Logic
// ============================================================

// ── GLOBAL STATE ──
let currentUser = null;
let allRepairs = [];
let allPOs = [];
let allStock = [];
let allBuses = [];
let deductRows = [];
let repairPartRows = [];
let poItemRows = [];
let pendingPORepairNo = null;
let pendingPOPlate = null;
let allShops = [];
let oilTemplateRows = [];
let allNotifications = [];
let readNotifIds = new Set(
  JSON.parse(sessionStorage.getItem('readNotifs') || '[]')
);
let _weekOffset = 0;
let _weeklyData = null;

// ── SWEETALERT HELPERS ──
const Toast = Swal.mixin({
  toast: true, position: 'top-end', showConfirmButton: false,
  timer: 2800, timerProgressBar: true,
  didOpen: t => { t.addEventListener('mouseenter', Swal.stopTimer); t.addEventListener('mouseleave', Swal.resumeTimer); }
});

function showToast(icon, title) { Toast.fire({ icon, title }); }

function showLoading(text = 'กำลังประมวลผล...') {
  Swal.fire({ title: text, allowOutsideClick: false, didOpen: () => Swal.showLoading() });
}

function confirmAction(text, cb) {
  Swal.fire({
    title: 'ยืนยันการดำเนินการ?',
    text, icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'ยืนยัน',
    cancelButtonText: 'ยกเลิก',
    reverseButtons: true
  }).then(r => { if (r.isConfirmed) cb(); });
}

// ── AUTH ──
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPassword').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('togglePass').addEventListener('click', () => {
  const pw = document.getElementById('loginPassword');
  const ico = document.querySelector('#togglePass i');
  pw.type = pw.type === 'password' ? 'text' : 'password';
  ico.className = pw.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
});

function doLogin() {
  const u = document.getElementById('loginUsername').value.trim();
  const p = document.getElementById('loginPassword').value.trim();
  if (!u || !p) { showToast('warning', 'กรุณากรอกข้อมูลให้ครบ'); return; }
  showLoading('กำลังเข้าสู่ระบบ...');
  google.script.run
    .withSuccessHandler(res => {
      Swal.close();
      if (res.success) {
        currentUser = res.user;
        sessionStorage.setItem('currentUser', JSON.stringify(res.user));
        initApp();
      } else { showToast('error', res.message); }
    })
    .withFailureHandler(e => { Swal.close(); showToast('error', e.message); })
    .login(u, p);
}

function initApp() {
  document.getElementById('loginPage').classList.add('d-none');
  document.getElementById('mainApp').classList.remove('d-none');
  document.getElementById('topbarUserName').textContent = currentUser.name;
  const rb = document.getElementById('topbarRoleBadge');
  rb.textContent = currentUser.role === 'admin' ? 'Admin' : 'User';
  if (currentUser.role !== 'admin') rb.classList.add('role-user');

  // Hide admin-only elements for regular users
  if (currentUser.role !== 'admin') {
    document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
  }

  navigateTo('dashboard');
  loadNotifications(); 
  hydrateCurrentUserSignature();
}

function hydrateCurrentUserSignature() {
  if (!currentUser || currentUser.signatureUrl) return;
  google.script.run
    .withSuccessHandler(users => {
      const u = (users || []).find(x => String(x.name || '').trim() === String(currentUser.name || '').trim());
      if (!u) return;
      currentUser.signatureUrl = u.signatureUrl || '';
      sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
    })
    .withFailureHandler(() => {})
    .getUsers();
}

function logout() {
  confirmAction('คุณต้องการออกจากระบบ?', () => {
    currentUser = null;
    sessionStorage.removeItem('currentUser');
    document.getElementById('mainApp').classList.add('d-none');
    document.getElementById('loginPage').classList.remove('d-none');
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
  });
}

// ── NAVIGATION ──
function navigateTo(page) {
  if (typeof toggleQuickActions === 'function') toggleQuickActions(true);
  document.querySelectorAll('[id^=page-]').forEach(el => el.classList.add('d-none'));
  document.querySelectorAll('.sidebar-nav-item').forEach(el => el.classList.remove('active'));
  const pageEl = document.getElementById(`page-${page}`);
  if (pageEl) pageEl.classList.remove('d-none');
  const navEl = document.querySelector(`.sidebar-nav-item[data-page="${page}"]`);
  if (navEl) navEl.classList.add('active');

  // Update mobile bottom nav active state
  document.querySelectorAll('.mobile-bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
  const bottomNavEl = document.querySelector(`.mobile-bottom-nav .nav-item[data-page="${page}"]`);
  if (bottomNavEl) bottomNavEl.classList.add('active');

  closeSidebar();
  switch (page) {
    case 'dashboard': loadDashboard(); break;
    case 'repairs': loadRepairs(); break;
    case 'po': loadPOs(); break;
    case 'stock': loadStock(); break;
    case 'shops': loadShops(); break;
    case 'buses': loadBuses(); break;
    case 'users': loadUsers(); break;
    case 'settings': loadSettings(); break;
    case 'summary' : loadSummary(); break;
    case 'oiltemplate': loadOilTemplate(); break;
    case 'linelog': loadLineLog(); break;
  }
}

// ── SIDEBAR TOGGLE ──
document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('show');
  document.getElementById('sidebarOverlay').classList.toggle('show');
});
if (document.getElementById('mobileMenuBtn')) {
  document.getElementById('mobileMenuBtn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('show');
    document.getElementById('sidebarOverlay').classList.toggle('show');
  });
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('show');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

function toggleQuickActions(forceClose = false) {
  const wrap = document.getElementById('mobileQuickActions');
  if (!wrap) return;
  wrap.classList.toggle('open', !forceClose && !wrap.classList.contains('open'));
}

function quickNewRepair() {
  toggleQuickActions(true);
  navigateTo('repairs');
  setTimeout(() => showRepairForm(), 0);
}

function quickNewPO() {
  toggleQuickActions(true);
  navigateTo('po');
  setTimeout(() => showPOForm(), 0);
}

function quickDeductStock() {
  toggleQuickActions(true);
  navigateTo('stock');
  setTimeout(() => showDeductForm(), 0);
}

function quickOpenSummaryMonth() {
  toggleQuickActions(true);
  navigateTo('summary');
  setTimeout(() => setQuickFilter('month'), 0);
}

// ── UTILITIES ──
function formatDate(d) {
  if (!d) return '—';
  try { const dt = new Date(d); return `${dt.getDate().toString().padStart(2,'0')}/${(dt.getMonth()+1).toString().padStart(2,'0')}/${dt.getFullYear()+543}`; }
  catch { return d; }
}
function todayISO() { return new Date().toISOString().split('T')[0]; }
function currentMonthISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function fmtNum(n) { return parseFloat(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function statusBadge(status) {
  const map = {
    // Repair
    'รอดำเนินการ'   : 'status-waiting',
    'กำลังซ่อม'     : 'status-inprogress',
    'รออะไหล่'      : 'status-waiting-parts',
    'เสร็จแล้ว'     : 'status-done',
    // PO
    'รออนุมัติ'     : 'status-waiting-parts',
    'อนุมัติแล้ว'   : 'status-approved',
    'รับของแล้ว'    : 'status-done',
    // legacy
    'รอซ่อม'        : 'status-waiting',
    'อนุมัติซ่อม'   : 'status-approved',
    'กำลังดำเนินการ' : 'status-inprogress',
    'ออกPO'         : 'status-waiting',
    'อนุมัติ'       : 'status-approved',
    'รับอะไหล่แล้ว' : 'status-done'
  };
  const icon = {
    // Repair
    'รอดำเนินการ'   : 'clock',
    'กำลังซ่อม'     : 'gear',
    'รออะไหล่'      : 'box',
    'เสร็จแล้ว'     : 'check-circle',
    // PO
    'รออนุมัติ'     : 'hourglass',
    'อนุมัติแล้ว'   : 'check',
    'รับของแล้ว'    : 'box-seam',
    // legacy
    'รอซ่อม'        : 'clock',
    'อนุมัติซ่อม'   : 'check',
    'กำลังดำเนินการ' : 'gear',
    'ออกPO'         : 'file',
    'อนุมัติ'       : 'check',
    'รับอะไหล่แล้ว' : 'check-circle'
  };
  const cls = map[status] || 'status-waiting-parts';
  const ico = icon[status] || 'question';
  return `<span class="badge-status ${cls}"><i class="bi bi-${ico}"></i>${status}</span>`;
}

// ── DASHBOARD ──
function loadDashboard() {
  // clock
  const updateClock = () => {
    const now = new Date();
    document.getElementById('dashDatetime').textContent =
      now.toLocaleDateString('th-TH', { weekday:'long', year:'numeric', month:'long', day:'numeric' })
      + ' ' + now.toLocaleTimeString('th-TH');
  };
  updateClock();
  setInterval(updateClock, 1000);
  loadWeeklySummary(0);

  // repairs
  google.script.run.withSuccessHandler(repairs => {
    allRepairs = repairs || [];

    const waiting      = repairs.filter(r => r.status === 'รอดำเนินการ');
    const inProgress   = repairs.filter(r => r.status === 'กำลังซ่อม');
    const waitingParts = repairs.filter(r => r.status === 'รออะไหล่');
    const pending      = repairs.filter(r => r.status !== 'เสร็จแล้ว');

    document.getElementById('dashWaiting').textContent      = waiting.length;
    document.getElementById('dashInProgress').textContent   = inProgress.length;
    document.getElementById('dashWaitingParts').textContent = waitingParts.length;
    document.getElementById('dashPendingCount').textContent = pending.length + ' รายการ';

    // แสดงเฉพาะงานที่ยังไม่เสร็จ เรียงวันที่ใหม่สุดก่อน
    const tbody = document.getElementById('dashRecentRepairs');
    tbody.closest('table').classList.add('table-card-mobile');
    tbody.innerHTML = pending.length
      ? pending
          .sort((a,b) => new Date(b.date) - new Date(a.date))
          .slice(0, 8)
          .map(r => `
            <tr>
              <td data-label="เลขที่">
                <a href="#" onclick="editRepair('${r.repairNo}')"
                  class="text-decoration-none fw-semibold">
                  ${r.repairNo}
                </a>
              </td>
              <td data-label="ทะเบียน">${r.plate}</td>
              <td data-label="สถานะ">${statusBadge(r.status)}</td>
              <td data-label="วันที่">${formatDate(r.date)}</td>
            </tr>`).join('')
      : `<tr><td colspan="4" data-label="" class="text-center text-muted py-4">
           <i class="bi bi-check-circle text-success d-block mb-1 fs-5"></i>
           ไม่มีงานค้าง
         </td></tr>`;
  }).getRepairs();

  // PO รออนุมัติ
  google.script.run.withSuccessHandler(pos => {
    allPOs = pos || [];
    const pending = pos.filter(p => p.status === 'รออนุมัติ');
    document.getElementById('dashPOPending').textContent = pending.length;
  }).getPOs();

  // stock + expiry
  google.script.run.withSuccessHandler(stock => {
    allStock = stock || [];
    const low = stock.filter(s =>
      parseFloat(s.qty) <= parseFloat(s.minQty) && parseFloat(s.minQty) > 0
    );
    document.getElementById('dashLowStock').innerHTML = low.length
      ? low.slice(0,5).map(s => `
          <div class="d-flex justify-content-between align-items-center
                       py-2 border-bottom" style="font-size:13px">
            <span>${s.partName}</span>
            <span class="badge"
              style="background:rgba(192,80,80,0.15);color:var(--claude-danger)">
              เหลือ ${s.qty} ${s.unit}
            </span>
          </div>`).join('')
      : `<div class="text-muted text-center py-2 small">
           <i class="bi bi-check-circle text-success me-1"></i>อะไหล่เพียงพอทั้งหมด
         </div>`;
  }).getStock();

  // รถใกล้หมดอายุ
  google.script.run.withSuccessHandler(buses => {
    allBuses = buses || [];
    const today = new Date();
    const alerts = [];

    buses.forEach(b => {
      [
        { label: 'ทะเบียน', date: b.regExpiry },
        { label: 'ประกัน',  date: b.insuranceExpiry }
      ].forEach(({ label, date }) => {
        if (!date) return;
        const diff = Math.ceil((new Date(date) - today) / 86400000);
        if (diff <= 60) {
          alerts.push({ plate: b.plate, label, diff, date });
        }
      });
    });

    alerts.sort((a,b) => a.diff - b.diff);

    document.getElementById('dashExpiryAlert').innerHTML = alerts.length
      ? alerts.slice(0,5).map(a => {
          const color = a.diff < 0
            ? 'var(--claude-danger)'
            : a.diff <= 30 ? 'var(--claude-warning)' : 'var(--claude-text-muted)';
          const label = a.diff < 0
            ? `หมดอายุแล้ว ${Math.abs(a.diff)} วัน`
            : `อีก ${a.diff} วัน`;
          return `
            <div class="d-flex justify-content-between align-items-center
                         py-2 border-bottom" style="font-size:13px">
              <span>
                <span class="fw-semibold">${a.plate}</span>
                <span class="text-muted ms-1">(${a.label})</span>
              </span>
              <span style="color:${color};font-size:12px;font-weight:600">
                ${label}
              </span>
            </div>`;
        }).join('')
      : `<div class="text-muted text-center py-2 small">
           <i class="bi bi-check-circle text-success me-1"></i>ไม่มีรายการใกล้หมดอายุ
         </div>`;
  }).getFullBuses();
}


// ── WEEKLY SUMMARY ──


function loadWeeklySummary(offset) {
  _weekOffset = (offset === undefined) ? _weekOffset : offset;

  // ปิด/เปิดปุ่ม next ถ้าเป็นสัปดาห์ปัจจุบัน
  const nextBtn = document.getElementById('weekNextBtn');
  if (nextBtn) nextBtn.disabled = _weekOffset >= 0;

  google.script.run
    .withSuccessHandler(data => {
      if (!data.success) return;
      _weeklyData = data;
      _renderWeeklySummary(data);
    })
    .withFailureHandler(e => console.warn('Weekly summary error:', e.message))
    .getWeeklySummary(_weekOffset);
}

function shiftWeek(offsetOrDelta) {
  // ถ้าเรียก shiftWeek(0) = reset, shiftWeek(-1)/shiftWeek(1) = เลื่อน
  if (offsetOrDelta === 0) {
    _weekOffset = 0;
  } else {
    _weekOffset += offsetOrDelta;
    if (_weekOffset > 0) _weekOffset = 0; // ไม่ให้เลื่อนไปอนาคต
  }
  loadWeeklySummary();
}

function _renderWeeklySummary(data) {
  // Label สัปดาห์
  const labelEl = document.getElementById('weeklyLabel');
  if (labelEl) {
    labelEl.textContent = data.weekLabel +
      (data.weekOffset === 0 ? ' (สัปดาห์นี้)' :
       data.weekOffset === -1 ? ' (สัปดาห์ที่แล้ว)' :
       ` (${Math.abs(data.weekOffset)} สัปดาห์ก่อน)`);
  }

  // Stat numbers
  _setTxt('wkOpened',  data.openedCount);
  _setTxt('wkDone',    data.doneCount);
  _setTxt('wkPending', data.pendingCount);
  _setTxt('wkCarry',   data.carryOverCount);

  // เปลี่ยนสีตาม pendingCount
  const pendEl = document.getElementById('wkPending');
  if (pendEl) {
    pendEl.style.color = data.pendingCount > 10
      ? 'var(--claude-danger)'
      : data.pendingCount > 5
        ? 'var(--claude-warning)'
        : 'var(--claude-secondary)';
  }

  // Extra section (top plates + by status)
  const extra = document.getElementById('weeklyExtra');
  if (extra) extra.style.removeProperty('display');

  // Top Plates
  const plateEl = document.getElementById('wkTopPlates');
  if (plateEl) {
    plateEl.innerHTML = data.topPlates.length
      ? data.topPlates.map((p, i) => `
          <div class="d-flex align-items-center gap-2 mb-2">
            <span style="width:20px;height:20px;border-radius:50%;
                         background:var(--claude-primary);color:white;
                         display:flex;align-items:center;justify-content:center;
                         font-size:11px;font-weight:700;flex-shrink:0">${i+1}</span>
            <span class="fw-semibold" style="font-size:13px">${p.plate}</span>
            <span class="badge rounded-pill"
              style="background:rgba(217,119,87,.15);color:var(--claude-primary);
                     font-size:11px;margin-left:auto">
              ${p.count} งาน
            </span>
          </div>`).join('')
      : '<span class="text-muted small">ไม่มีงานเปิดสัปดาห์นี้</span>';
  }

  // By Status
  const statusEl = document.getElementById('wkByStatus');
  if (statusEl) {
    const entries = Object.entries(data.byStatus);
    statusEl.innerHTML = entries.length
      ? entries.map(([st, cnt]) => `
          <div class="d-flex align-items-center justify-content-between mb-2">
            ${statusBadge(st)}
            <span class="fw-bold" style="font-size:13px">${cnt} งาน</span>
          </div>`).join('')
      : '<span class="text-muted small">ไม่มีงานค้าง 🎉</span>';
  }
}

function _setTxt(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

function openWeeklyModal() {
  if (!_weeklyData) return;
  const data = _weeklyData;

  document.getElementById('weeklyModalLabel').textContent = data.weekLabel;

  const today = new Date();
  const tbody = document.getElementById('weeklyModalBody');
  const count = data.pendingDetails.length;

  document.getElementById('weeklyModalCount').textContent =
    `งานค้างทั้งหมด ${count} รายการ`;

  tbody.innerHTML = count
    ? data.pendingDetails.map(r => {
        const diffDays = Math.ceil(
          (today - new Date(r.createdAt || r.date)) / 86400000
        );
        const ageColor = diffDays > 14
          ? 'var(--claude-danger)'
          : diffDays > 7
            ? 'var(--claude-warning)'
            : 'var(--claude-text-muted)';
        return `<tr>
          <td>
            <a href="#" onclick="closeWeeklyAndEdit('${r.repairNo}')"
               class="fw-semibold text-decoration-none"
               style="color:var(--claude-primary)">
              ${r.repairNo}
            </a>
          </td>
          <td>${formatDate(r.date)}</td>
          <td>
            <span class="badge"
              style="background:rgba(61,79,107,.12);color:var(--claude-secondary)">
              ${r.plate}
            </span>
          </td>
          <td style="max-width:200px;overflow:hidden;
                     text-overflow:ellipsis;white-space:nowrap"
              title="${r.repairList}">
            ${r.repairList}
          </td>
          <td>${statusBadge(r.status)}</td>
          <td style="font-weight:600;color:${ageColor}">
            ${diffDays} วัน
          </td>
        </tr>`;
      }).join('')
    : `<tr><td colspan="6">
         <div class="empty-state" style="padding:32px">
           <i class="bi bi-check-circle text-success d-block mb-2 fs-3"></i>
           ไม่มีงานค้าง 🎉
         </div>
       </td></tr>`;

  new bootstrap.Modal(document.getElementById('weeklyModal')).show();
}

function closeWeeklyAndEdit(repairNo) {
  bootstrap.Modal.getInstance(document.getElementById('weeklyModal'))?.hide();
  setTimeout(() => editRepair(repairNo), 300);
}

// ── SUMMARY ──
function loadSummary(showLoad = false) {
  const loadBusesPromise = new Promise(resolve => {
    if (allBuses.length) { resolve(); return; }
    google.script.run
      .withSuccessHandler(buses => { allBuses = buses || []; resolve(); })
      .withFailureHandler(() => resolve())
      .getBusPlates();
  });

  const loadShopsPromise = new Promise(resolve => {
    if (allShops.length) { resolve(); return; }
    google.script.run
      .withSuccessHandler(shops => { allShops = shops || []; resolve(); })
      .withFailureHandler(() => resolve())
      .getShops();
  });

  Promise.all([loadBusesPromise, loadShopsPromise]).then(() => {
    _doLoadSummary(showLoad);
  });
}

function _doLoadSummary(showLoad = false) {
  const filter = {
    from     : document.getElementById('sumFrom').value  || null,
    to       : document.getElementById('sumTo').value    || null,
    plate    : document.getElementById('sumPlate').value || null,
    shopName : document.getElementById('sumShop').value  || null
  };

  if (showLoad) showLoading('กำลังโหลดข้อมูล...'); // ← แสดงเฉพาะเมื่อสั่ง

  google.script.run
    .withSuccessHandler(res => {
      Swal.close();
      if (!res.success) { showToast('error', res.message); return; }
      renderSummary(res);
    })
    .withFailureHandler(e => { Swal.close(); showToast('error', e.message); })
    .getExpenseSummary(filter);
}

function renderSummary(data) {
  const grandTotal = data.total;
  ['sumByPlateBody', 'sumByShopBody', 'sumDetailBody'].forEach(id => {
    document.getElementById(id)?.closest('table')?.classList.add('table-card-mobile');
  });

  // Stat cards
  document.getElementById('sumTotal').textContent = fmtNum(grandTotal);
  document.getElementById('sumCount').textContent = data.count;
  document.getElementById('sumTopPlate').textContent =
    data.byPlate[0]?.plate || '—';
  document.getElementById('sumTopShop').textContent =
    data.byShop[0]?.shop   || '—';

  // แยกตามรถ
  document.getElementById('sumByPlateBody').innerHTML = data.byPlate.length
    ? data.byPlate.map(r => {
        const pct = grandTotal > 0 ? (r.total / grandTotal * 100).toFixed(1) : 0;
        return `<tr>
          <td data-label="ทะเบียน" class="fw-semibold">${r.plate}</td>
          <td data-label="ยอดรวม" class="text-end fw-semibold">${fmtNum(r.total)}</td>
          <td data-label="สัดส่วน" style="min-width:100px">
            <div class="summary-share d-flex align-items-center gap-2">
              <div style="flex:1;height:6px;background:var(--claude-border);border-radius:3px">
                <div style="width:${pct}%;height:100%;background:var(--claude-primary);border-radius:3px"></div>
              </div>
              <span class="text-muted" style="font-size:11px;width:36px">${pct}%</span>
            </div>
          </td>
        </tr>`;
      }).join('')

function setQuickFilter(period) {
  const now = new Date();
  let from, to = now.toISOString().split('T')[0];
  if (period === 'month') {
    from = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
  } else if (period === 'quarter') {
    const q = Math.floor(now.getMonth() / 3);
    from = new Date(now.getFullYear(), q * 3, 1).toISOString().split('T')[0];
  } else if (period === 'year') {
    from = `${now.getFullYear()}-01-01`;
  }
  document.getElementById('sumFrom').value = from;
  document.getElementById('sumTo').value   = to;
  loadSummary(true);
}

function resetSummaryFilter() {
  ['sumFrom','sumTo','sumPlate','sumShop'].forEach(id => {
    document.getElementById(id).value = '';
  });
  loadSummary(true); // ← true
}

function filterRepairs() {
  const q = document.getElementById('repairSearch').value.toLowerCase();
  const s = document.getElementById('repairStatusFilter').value;
  const m = document.getElementById('repairMonthFilter').value;
  renderRepairTable(allRepairs.filter(r =>
    (!q || r.repairNo.toLowerCase().includes(q) || r.plate.toLowerCase().includes(q)) &&
    (!s || r.status === s) &&
    (!m || r.date.startsWith(m))
  ));
}

function applyRepairPreset(kind) {
  const search = document.getElementById('repairSearch');
  const status = document.getElementById('repairStatusFilter');
  const month = document.getElementById('repairMonthFilter');
  if (!search || !status || !month) return;
  if (kind === 'clear') {
    search.value = '';
    status.value = '';
    month.value = '';
  } else {
    if (kind === 'month') month.value = currentMonthISO();
    if (kind === 'waiting') status.value = 'รอดำเนินการ';
    if (kind === 'parts') status.value = 'รออะไหล่';
  }
  filterRepairs();
}

function showRepairForm(repair = null) {
  document.getElementById('repairListView').classList.add('d-none');

  const isCompleted = repair && repair.status === 'เสร็จแล้ว';
  
  // ล็อกฟิลด์ป้อนข้อมูลหากใบแจ้งซ่อมเสร็จสิ้นแล้ว
  const fields = ['repairDate', 'repairPlate', 'repairChassis', 'repairMileage', 'repairOilProgram', 'repairList', 'repairSummary'];
  fields.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = isCompleted;
  });

  // ซ่อน/แสดงปุ่มบันทึกและปุ่มเลือกอะไหล่
  const saveBtn = document.getElementById('saveRepairBtn');
  if (saveBtn) saveBtn.style.display = isCompleted ? 'none' : '';
  const addPartBtn = document.getElementById('openPartPickerBtn');
  if (addPartBtn) addPartBtn.style.display = isCompleted ? 'none' : '';

  if (repair) {
    document.getElementById('repairFormTitle').textContent = 'แก้ไขการแจ้งซ่อม';
    document.getElementById('repairFormBreadcrumb').textContent = repair.repairNo;
    document.getElementById('editRepairNo').value = repair.repairNo;
    document.getElementById('repairNo').value = repair.repairNo;
    document.getElementById('repairDate').value = repair.date;
    document.getElementById('repairPlate').value = repair.plate;
    document.getElementById('repairChassis').value = repair.chassis || '';
    document.getElementById('repairMileage').value = repair.mileage || '';
    document.getElementById('repairOilProgram').value = repair.oilProgram || '';
    document.getElementById('repairList').value = repair.repairList || '';
    document.getElementById('repairSummary').value = repair.repairSummary || '';

    // Show status card
    document.getElementById('repairStatusCard').style.cssText = '';
    renderRepairStepper(repair.status);
    if (repair.status === 'รออะไหล่') document.getElementById('createPOBtn').style.display = '';

    // Load parts
    google.script.run.withSuccessHandler(parts => {
      repairPartRows = parts.map(p => ({ partName: p.partName, qty: p.qty }));
      renderRepairParts();
    }).getRepairParts(repair.repairNo);
  } else {
    document.getElementById('repairFormTitle').textContent = 'แจ้งซ่อมใหม่';
    document.getElementById('repairFormBreadcrumb').textContent = 'ใหม่';

    document.getElementById('repairChassis').value = '';
    document.getElementById('repairMileage').value = '';
    document.getElementById('repairOilProgram').value = '';
    document.getElementById('repairList').value = '';
    document.getElementById('repairSummary').value = '';

function renderRepairStepper(currentStatus) {
  const steps = ['รอดำเนินการ', 'กำลังซ่อม', 'รออะไหล่', 'เสร็จแล้ว'];
  const icons = ['clock', 'gear', 'box', 'check-circle'];
  const curIdx = steps.indexOf(currentStatus);
  document.getElementById('repairStepperForm').innerHTML = steps.map((s, i) => {
    const cls = i < curIdx ? 'completed' : i === curIdx ? 'active' : '';
    return `<div class="step-item ${cls}">
      <div class="step-circle"><i class="bi bi-${i < curIdx ? 'check-lg' : icons[i]}"></i></div>
      <div class="step-label">${s}</div>
    </div>`;
  }).join('');
}

function saveRepair() {

  const repair = {
    repairNo   : document.getElementById('editRepairNo').value,
    date       : document.getElementById('repairDate').value,
    plate      : document.getElementById('repairPlate').value,
    chassis    : document.getElementById('repairChassis').value,
    mileage    : document.getElementById('repairMileage').value,
    oilProgram : document.getElementById('repairOilProgram').value,
    repairList : document.getElementById('repairList').value,
    repairSummary :document.getElementById('repairSummary').value,
    createdBy  : currentUser?.name || ''

  };
  if (!repair.date || !repair.plate || !repair.repairList) {
    showToast('warning', 'กรุณากรอกข้อมูลที่จำเป็นให้ครบ');
    return;
  }
  showLoading('กำลังบันทึก...');
  google.script.run
    .withSuccessHandler(res => {
      Swal.close();
      if (res.success) {
        showToast('success', 'บันทึกข้อมูลเรียบร้อย');
        loadRepairs();
        showRepairList();
        // ── ถามส่ง Line ──
        Swal.fire({
          icon : 'success',
          title: 'บันทึกเรียบร้อย',
          text : 'ต้องการส่งขออนุมัติเข้า Line กลุ่มหรือไม่?',
          showDenyButton: true,
          showCancelButton: true,
          confirmButtonText: '📲 ส่ง Line (อัตโนมัติ)',
          denyButtonText: '🔗 แชร์เข้า Line',
          cancelButtonText: 'ไม่ส่ง',
          confirmButtonColor: '#3B82F6',
          denyButtonColor: '#06C755',
          cancelButtonColor: '#6B7280'
        }).then(r => {
          if (r.isConfirmed) {
            showLoading('กำลังส่ง Line...');
            google.script.run
              .withSuccessHandler(lineRes => {
                Swal.close();
                showToast(
                  lineRes.success ? 'success' : 'error',
                  lineRes.success
                    ? 'ส่ง Line เรียบร้อย'
                    : (lineRes.message || 'ส่ง Line ไม่สำเร็จ')
                );
              })
              .withFailureHandler(err => {
                Swal.close();
                showToast('error', err.message);
              })
              .sendRepairToLine(res.repairNo);
          } else if (r.isDenied) {
            shareRepairToLine(res.repairNo);
          }
        });
      } else {
        showToast('error', res.message);
      }
    })
    .withFailureHandler(e => {
      Swal.close();
      showToast('error', e.message);
    })
    .saveRepair(repair, repairPartRows);
}

function changeRepairStatus(status) {
  const repairNo = document.getElementById('editRepairNo').value;
  if (!repairNo) return;
  if (status === 'เสร็จแล้ว') {
  const summary =
    document.getElementById('repairSummary').value.trim();
    if (!summary) {
      showToast(
        'warning',
        'กรุณากรอกผลการซ่อมก่อนปิดงาน'
      );
      return;
    }
  }
  confirmAction(`เปลี่ยนสถานะเป็น "${status}"?`, () => {
    showLoading('กำลังอัปเดต...');
    google.script.run
      .withSuccessHandler(res => {
        Swal.close();
        if (res.success) {
          showToast('success', 'อัปเดตสถานะเรียบร้อย');
          renderRepairStepper(status);
          document.getElementById('createPOBtn').style.display = status === 'รออะไหล่' ? '' : 'none';
          const r = allRepairs.find(x => x.repairNo === repairNo);
          if (r) r.status = status;
        } else { showToast('error', res.message); }
      })
      .withFailureHandler(e => { Swal.close(); showToast('error', e.message); })
      .updateRepairStatus(repairNo, status);
  });
}

function deleteRepair(repairNo) {
  confirmAction(`ลบรายการซ่อม ${repairNo}?`, () => {
    showLoading('กำลังลบ...');
    google.script.run
      .withSuccessHandler(res => {
        Swal.close();
        if (res.success) { showToast('success', 'ลบเรียบร้อย'); loadRepairs(); }
        else { showToast('error', res.message); }
      })
      .withFailureHandler(e => { Swal.close(); showToast('error', e.message); })
      .deleteRepair(repairNo);
  });
}

function createPOFromRepairNo(repairNo, plate) {

function filterPOs() {
  const q = document.getElementById('poSearch').value.toLowerCase();
  const s = document.getElementById('poStatusFilter').value;
  const m = document.getElementById('poMonthFilter').value;
  renderPOTable(allPOs.filter(p =>
    (!q || p.poNo.toLowerCase().includes(q) || p.shopName.toLowerCase().includes(q)) &&
    (!s || p.status === s) &&
    (!m || p.issueDate.startsWith(m))
  ));
}

function applyPOPreset(kind) {
  const search = document.getElementById('poSearch');
  const status = document.getElementById('poStatusFilter');
  const month = document.getElementById('poMonthFilter');
  if (!search || !status || !month) return;
  if (kind === 'clear') {
    search.value = '';
    status.value = '';
    month.value = '';
  } else {
    if (kind === 'month') month.value = currentMonthISO();
    if (kind === 'pending') status.value = 'รออนุมัติ';
    if (kind === 'received') status.value = 'รับของแล้ว';
  }
  filterPOs();
}

function renderPOStepper(currentStatus) {
  const steps = ['รออนุมัติ', 'อนุมัติแล้ว', 'รับของแล้ว'];
  const icons = ['hourglass', 'check', 'check-circle'];
  const curIdx = steps.indexOf(currentStatus);
  document.getElementById('poStepperForm').innerHTML = steps.map((s, i) => {
    const cls = i < curIdx ? 'completed' : i === curIdx ? 'active' : '';
    return `<div class="step-item ${cls}">
      <div class="step-circle"><i class="bi bi-${i < curIdx ? 'check-lg' : icons[i]}"></i></div>
      <div class="step-label">${s}</div>
    </div>`;
  }).join('');
}

function calcPOItemAmount(idx) {
  const p = poItemRows[idx];
  p.amount = (p.qty * p.pricePerUnit) - p.discount;
  const el = document.getElementById(`poAmt_${idx}`);
  if (el) el.textContent = fmtNum(p.amount);
  calcPOTotal();
}

function calcPOTotal() {
  const subtotal = poItemRows.reduce((s, p) => s + (parseFloat(p.amount) || 0), 0);
  const vatType = document.getElementById('poVatType').value;
  let vat = 0, grand = subtotal;
  if (vatType === 'exclusive') { vat = subtotal * 0.07; grand = subtotal + vat; }
  else if (vatType === 'inclusive') { vat = subtotal - subtotal / 1.07; grand = subtotal; }
  document.getElementById('poSubtotal').textContent = fmtNum(vatType === 'inclusive' ? subtotal / 1.07 : subtotal);
  document.getElementById('poVatAmount').textContent = fmtNum(vat);
  document.getElementById('poGrandTotal').textContent = fmtNum(grand);
  document.getElementById('poVatRow').style.display = vatType !== 'none' ? '' : 'none';
}

      showToast('success', 'อัปเดตสถานะเรียบร้อย');

      if (status === 'อนุมัติแล้ว') {
        showLoading('กำลังสร้าง PDF พร้อมลายเซ็น...');

          .withSuccessHandler(pdfRes => {

// ── แปลง settings array → object ──
function _settingsToObj(arr) {
  const o = {};
  (arr || []).forEach(s => { o[s.key] = s.value; });
  return o;
}

function renderPrintPreview(po, items, settingsArr, sigUrl) {
  const s       = Array.isArray(settingsArr) ? _settingsToObj(settingsArr) : (settingsArr || {});
  const vatType = po.vatType || 'none';
  const subtotal = items.reduce((sum, i) => sum + (parseFloat(i.amount) || 0), 0);
  let vat = 0, grand = subtotal;
  if (vatType === 'exclusive') { vat = subtotal * 0.07; grand = subtotal + vat; }
  else if (vatType === 'inclusive') { vat = subtotal - subtotal / 1.07; grand = subtotal; }
  const preVat = vatType === 'inclusive' ? subtotal / 1.07 : subtotal;

  const logoHtml = s.COMPANY_LOGO
    ? `<img src="${s.COMPANY_LOGO}" style="width:120px;height:120px;object-fit:contain;border-radius:50%;border:2px solid rgba(255,255,255,0.4)">`
    : `<div style="width:120px;height:120px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;color:#1a3a5c;text-align:center;font-weight:700">LOGO<br>บริษัท</div>`;

  const stampHtml = s.COMPANY_STAMP
    ? `<img src="${s.COMPANY_STAMP}" style="width:100px;height:100px;object-fit:contain;opacity:0.9">`
    : `<div style="width:100px;height:100px;border:1.5px dashed #ccc;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#bbb;text-align:center;background:#fafafa">ตรา<br>ประทับ</div>`;

  // ── แบ่ง items เป็น chunk หน้าละ 15 ──
  const ROWS_PER_PAGE = 15;
  const chunks = [];
  for (let i = 0; i < Math.max(items.length, 1); i += ROWS_PER_PAGE) {
    chunks.push(items.slice(i, i + ROWS_PER_PAGE));
  }
  const totalPages = chunks.length;

  // ── Header บริษัท (ทุกหน้า) ──
  function renderHeader(pageNum) {
    return `
    <div style="display:flex;align-items:stretch;border-bottom:3px solid #1a3a5c">

            <div style="font-size:11px;color:#555">โทร: ${s.COMPANY_TEL || ''} &nbsp;|&nbsp; แฟกซ์: ${s.COMPANY_FAX || ''}</div>
          </div>
        </div>
        <div style="text-align:right;min-width:180px;flex-shrink:0">
          <div class="po-dark-bg" style="background:#1a3a5c;color:#fff;padding:6px 14px;text-align:center;margin-bottom:8px">
            <div style="font-size:15px;font-weight:700;letter-spacing:2px">ใบสั่งซื้อ</div>
            <div style="font-size:10px;letter-spacing:3px;opacity:0.85">PURCHASE ORDER</div>
          </div>
          <table style="width:100%;font-size:11px;border-collapse:collapse">
            <tr>
              <td style="text-align:right;padding:2px 6px 2px 0;color:#555">เลขที่ :</td>
              <td style="border-bottom:1px solid #000;text-align:center;font-weight:700;padding:2px 4px">${po.poNo}</td>
            </tr>
            <tr>
              <td style="text-align:right;padding:2px 6px 2px 0;color:#555">วันที่ :</td>
              <td style="border-bottom:1px solid #000;text-align:center;padding:2px 4px">${formatDate(po.issueDate)}</td>
            </tr>
            <tr>

            </tr>
          </table>

      </div>
    </div>`;
  }

  // ── Supplier + Quote (หน้าแรกเท่านั้น) ──
  function renderSupplier() {
    return `
    <div style="display:flex;border-bottom:1px solid #ccc;font-size:11px">
      <div style="flex:1;padding:10px 14px;border-right:1px solid #ccc">
        <div style="font-size:10px;font-weight:700;color:#1a3a5c;letter-spacing:0.5px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #e8e8e8">ข้อมูลผู้ขาย / VENDOR</div>
        <table style="width:100%;border-collapse:collapse">
          <tr><td style="color:#888;width:85px;padding:2px 0">ชื่อผู้ขาย</td><td style="font-weight:600;border-bottom:1px solid #f0f0f0;padding:2px 4px">${po.shopName || ''}</td></tr>
          <tr><td style="color:#888;padding:2px 0;vertical-align:top">ที่อยู่</td><td style="border-bottom:1px solid #f0f0f0;padding:2px 4px">${po.shopAddress || ''}</td></tr>
          <tr><td style="color:#888;padding:2px 0">เลขผู้เสียภาษี</td><td style="border-bottom:1px solid #f0f0f0;padding:2px 4px">${po.taxId || ''}</td></tr>
        </table>
      </div>
      <div style="width:220px;padding:10px 14px;flex-shrink:0">
        <div style="font-size:10px;font-weight:700;color:#1a3a5c;letter-spacing:0.5px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #e8e8e8">อ้างอิงใบเสนอราคา</div>

  }

  // ── Table Header ──
  function renderTableHeader() {
    return `
    <div class="po-light-bg" style="background:#f0f4f8;border-bottom:1px solid #ccc;padding:5px 14px;font-size:11px;font-weight:700;color:#1a3a5c;text-align:center;letter-spacing:0.5px">
      กรุณาจำหน่ายสินค้าตามรายการดังต่อไปนี้

    <table style="width:100%;border-collapse:collapse;font-size:11px">
      <thead>
        <tr class="po-thead-row" style="background:#1a3a5c;color:#fff">
          <th class="po-th" style="padding:6px 8px;width:32px;text-align:center;font-weight:600">ลำดับ</th>
          <th class="po-th" style="padding:6px 8px;text-align:left;font-weight:600">รายละเอียด / สินค้า</th>
          <th class="po-th" style="padding:6px 8px;width:50px;text-align:center;font-weight:600">จำนวน</th>
          <th class="po-th" style="padding:6px 8px;width:45px;text-align:center;font-weight:600">หน่วย</th>
          <th class="po-th" style="padding:6px 8px;width:75px;text-align:center;font-weight:600">ราคา/หน่วย</th>
          <th class="po-th" style="padding:6px 8px;width:60px;text-align:center;font-weight:600">ส่วนลด</th>
          <th class="po-th" style="padding:6px 8px;width:80px;text-align:center;font-weight:600">จำนวนเงิน</th>
        </tr>
      </thead>`;
  }

  // ── Rows ──
  function renderRows(chunk, startIdx, isLastPage) {
    const rows = [...chunk, null];
    while (rows.length < ROWS_PER_PAGE) rows.push(null);
    return rows.map((it, i) => {
      const globalIdx = startIdx + i;
      return `
      <tr style="background:${globalIdx % 2 === 0 ? '#fff' : '#f9fafb'};border-bottom:1px solid #eee">
        <td style="padding:5px 8px;text-align:center;color:#aaa">${it ? globalIdx + 1 : ''}</td>
        <td style="padding:5px 8px">${it ? it.partName : ''}</td>
        <td style="padding:5px 8px;text-align:center">${it ? it.qty : ''}</td>
        <td style="padding:5px 8px;text-align:center;color:#888">${it ? (it.unit || '') : ''}</td>
        <td style="padding:5px 8px;text-align:right">${it ? fmtNum(it.pricePerUnit) : ''}</td>
        <td style="padding:5px 8px;text-align:right;color:#c05050">${it && parseFloat(it.discount) > 0 ? fmtNum(it.discount) : (it ? '-' : '')}</td>
        <td style="padding:5px 8px;text-align:right;font-weight:600">${it ? fmtNum(it.amount) : ''}</td>
      </tr>`;
    }).join('');
  }

  // ── Note ──
  function renderNotes(items) {
    const noted = items
      .map((it, i) => it.note ? { idx: i + 1, name: it.partName, note: it.note } : null)
      .filter(Boolean);
    if (!noted.length) return '';
    return `
    <div style="border-top:1px dashed #ccc;padding:6px 14px 4px;font-size:11px">
      <span style="font-weight:700;color:#1a3a5c">หมายเหตุรายการ : </span>
      ${noted.map(n => `<span style="margin-right:12px">รายการที่ ${n.idx} ${n.note}</span>`).join(',')}
    </div>`;
  }
  // ── Footer (หน้าสุดท้ายเท่านั้น) ──
  function renderFooter() {
    // ── สร้าง signature box ตามบทบาท ──
    const sigBoxes = [
      {
        role     : 'ผู้ขอ',
        name     : po.createdBy || '',
        sigUrl   : parseDriveUrl(po.createdBySignatureUrl || currentUser?.signatureUrl || ''),
        showStamp: false,
        issueDate: po.issueDate || ''
      },
      {
        role     : 'ผู้อนุมัติ',
        name     : po.approvedBy || '',
        sigUrl   : parseDriveUrl(sigUrl || ''),
        showStamp: false,
        approvedDate: po.approvedAt || '' 
      },
      {
        role     : 'ผู้มีอำนาจลงนาม',
        name     : '',
        sigUrl   : '',
        showStamp: true
      }
    ];

    const sigHtml = sigBoxes.map((box, i) => `
      <div style="flex:1;text-align:center;padding:0 10px;
                  ${i < 2 ? 'border-right:1px solid #eee' : ''}">
        <div style="height:70px;overflow:hidden;display:flex;align-items:flex-end;
                    justify-content:center;margin-bottom:4px">
          ${box.showStamp
            ? stampHtml
            : box.sigUrl
              ? `<img src="${box.sigUrl}"
                      style="max-height:65px;max-width:130px;object-fit:contain;display:block"
                      onerror="this.style.display='none'">`
              : `<div style="height:65px"></div>`
          }
        </div>
        <div style="border-top:1px solid #000;padding-top:5px;
                    font-size:11px;font-weight:700;color:#1a3a5c">
          ${box.role}
        </div>
        <div style="font-size:11px;color:#444;min-height:16px">
          ${(box.name && !box.name.startsWith('http'))
            ? `( ${box.name} )`
            : '( ........................... )'}
        </div>
        <div style="font-size:11px;color:#aaa">
          วันที่ ${box.issueDate ? formatDate(box.issueDate) : (box.approvedDate ? formatDate(box.approvedDate) : '......../......../........')}
        </div>
      </div>`
    ).join('');

    return `
    <div style="display:flex;border-top:2px solid #1a3a5c">
      <div style="flex:1;padding:10px 14px;border-right:1px solid #ccc;font-size:11px">
        <div style="display:flex;align-items:center;gap:6px;
                    padding-bottom:6px;border-bottom:1px solid #ddd;
                    margin-bottom:6px;flex-wrap:wrap">
          <span style="font-weight:700;color:#1a3a5c">หมายเหตุ :</span>
          ${po.plate
            ? `<span class="po-yellow-bg" style="background:#ffd600;color:#5a3e00;
                            padding:1px 10px;font-weight:700">
                ${po.plate}
              </span>`
            : ''}
          ${po.refRepairNo
            ? `<span class="po-dark-bg" style="background:#1a3a5c;color:#fff;padding:1px 10px">
                Job: ${po.refRepairNo}
              </span>`
            : ''}
        </div>
        <div style="color:#444;line-height:1.9">
          (1) โปรดระบุเลขที่ใบสั่งซื้อบนใบส่งของทุกฉบับ<br>
          (2) การวางบิลและรับเช็คเป็นไปตามกำหนดเวลาที่บริษัทกำหนด<br>
          (3) ในการวางบิลให้แนบสำเนาใบสั่งซื้อกำกับด้วย
        </div>
      </div>
      <div style="width:220px;font-size:11px;flex-shrink:0">
        <table style="width:100%;border-collapse:collapse">
          <tr style="border-bottom:1px solid #eee">
            <td style="padding:5px 12px;color:#555">มูลค่าสินค้าก่อนภาษี</td>
            <td style="padding:5px 12px;text-align:right">${fmtNum(preVat)}</td>
          </tr>
          <tr style="border-bottom:1px solid #eee">
            <td style="padding:5px 12px;color:#555">ส่วนลดสินค้า</td>
            <td style="padding:5px 12px;text-align:right">0.00</td>
          </tr>
          <tr style="border-bottom:1px solid #eee">
            <td style="padding:5px 12px;color:#555">เงินหลังหักส่วนลด</td>
            <td style="padding:5px 12px;text-align:right">${fmtNum(preVat)}</td>
          </tr>
          <tr style="border-bottom:1px solid #eee">
            <td style="padding:5px 12px;color:#555">ภาษีมูลค่าเพิ่ม (7%)</td>
            <td style="padding:5px 12px;text-align:right">
              ${vatType !== 'none' ? fmtNum(vat) : '0.00'}
            </td>
          </tr>
          <tr class="po-dark-bg" style="background:#1a3a5c">
            <td style="padding:7px 12px;color:#fff;font-weight:700">จำนวนเงินทั้งสิ้น</td>
            <td style="padding:7px 12px;text-align:right;color:#fff;font-weight:700">
              ${fmtNum(grand)}
            </td>
          </tr>
        </table>
      </div>
    </div>
    <div style="display:flex;padding:16px 14px 14px;border-top:1px solid #eee">
      ${sigHtml}
    </div>`;
  }

  // ── Render ทุกหน้า ──
    const pages = chunks.map((chunk, pageIdx) => {
    const isFirst    = pageIdx === 0;
    const isLast     = pageIdx === totalPages - 1;
    const startIdx   = pageIdx * ROWS_PER_PAGE;
    const pageBreak  = !isLast ? 'page-break-after:always;' : '';

    return `
    <div style="background:#fff;max-width:780px;margin:0 auto;${pageBreak}">
      ${renderHeader(pageIdx + 1)}
      ${isFirst ? renderSupplier() : ''}
      ${renderTableHeader()}
        <tbody>${renderRows(chunk, startIdx, isLast)}</tbody>
      </table>
      ${isLast ? renderNotes(items) : ''}
      ${isLast ? renderFooter() : ''}
    </div>`;
  }).join('');

  document.getElementById('printPreview').innerHTML =
    `<div id="poPrintDoc" style="font-family:'Sarabun',sans-serif;font-size:12px;color:#000">${pages}</div>`;

  new bootstrap.Modal(document.getElementById('printModal')).show();
}

function printPO() {
  const el = document.getElementById('poPrintDoc');
  if (!el) return;

  // แสดง loading
  Swal.fire({
    title: 'กำลังเตรียมเอกสาร...',
    html: '<div style="font-size:14px;color:#666">กรุณารอสักครู่</div>',
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  setTimeout(() => {
    try {
      const win = window.open('', '_blank');
      if (!win) {
        Swal.fire({
          icon: 'warning',
          title: 'ไม่สามารถเปิดหน้าต่างได้',
          text: 'กรุณาอนุญาต Pop-up สำหรับเว็บนี้ แล้วลองใหม่อีกครั้ง',
          confirmButtonText: 'รับทราบ'
        });
        return;
      }

      win.document.write(`<!DOCTYPE html><html><head>
          <title>ใบสั่งซื้ออะไหล่</title>
          <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
          <style>
            * {
              -webkit-print-color-adjust: exact !important;
              print-color-adjust: exact !important;
              color-adjust: exact !important;
            }
            body { font-family:'Sarabun',sans-serif; margin:0; padding:16px; }
            @media print {
              body { padding:0; }
              @page { size:A4; margin:12mm; }
            }
            .po-dark-bg,
            .po-dark-bg td,
            .po-thead-row,
            .po-thead-row th,
            .po-th,
            th {
              background-color: #1a3a5c !important;
              background: #1a3a5c !important;
              color: #ffffff !important;
            }
            .po-light-bg {
              background-color: #f0f4f8 !important;
              background: #f0f4f8 !important;
              color: #1a3a5c !important;
            }
            .po-yellow-bg {
              background-color: #ffd600 !important;
              background: #ffd600 !important;
              color: #5a3e00 !important;
            }
            /* ตารางแถวสลับสี */
            tbody tr:nth-child(even) td {
              background-color: #f9fafb !important;
            }
          </style>
        </head><body>
        <div style="max-width:780px;margin:0 auto">${el.outerHTML}</div>
        <script>window.onload=()=>window.print();<\/script>
      </body></html>`);
      win.document.close();

      const poNo = document.getElementById('editPONo').value;
      if (poNo && poNo !== 'PREVIEW') {
        google.script.run
          .withSuccessHandler(() => {
            loadPOs();
          })
          .markPOAsPrinted(poNo);
      }

      // ปิด loading หลังเปิดหน้าต่างสำเร็จ
      Swal.fire({
        icon: 'success',
        title: 'เปิดเอกสารแล้ว',
        text: 'หน้าต่างพิมพ์จะเปิดขึ้นอัตโนมัติ',
        timer: 1800,
        timerProgressBar: true,
        showConfirmButton: false
      });

    } catch(e) {
      Swal.fire({
        icon: 'error',
        title: 'เกิดข้อผิดพลาด',
        text: e.message,
        confirmButtonText: 'ปิด'
      });
    }
  }, 600); // หน่วงเล็กน้อยให้ loading แสดงก่อน
}

// ── STOCK ──
function loadStock() {
  showStockList();
  google.script.run.withSuccessHandler(stock => {
    allStock = stock || [];
    updateStockStats(stock);
    renderStockTable(stock);
  }).getStock();
  loadStockLog();
}

function showStockList() {
  const list = document.getElementById('stockListView');
  const form = document.getElementById('stockFormView');
  const deduct = document.getElementById('stockDeductView');
  if (list) list.classList.remove('d-none');
  if (form) form.classList.add('d-none');
  if (deduct) deduct.classList.add('d-none');
}

function updateStockStats(stock) {
  const total = stock.length;
  const inStock = stock.filter(s => parseFloat(s.qty) > parseFloat(s.minQty || 0)).length;
  const low = stock.filter(s => parseFloat(s.qty) > 0 && parseFloat(s.qty) <= parseFloat(s.minQty || 0)).length;
  const out = stock.filter(s => parseFloat(s.qty) <= 0).length;
  
  const totalEl = document.getElementById('stockTotalItems');
  const inStockEl = document.getElementById('stockInStock');
  const lowEl = document.getElementById('stockLow');
  const outEl = document.getElementById('stockOut');
  
  if (totalEl) totalEl.textContent = total;
  if (inStockEl) inStockEl.textContent = inStock;
  if (lowEl) lowEl.textContent = low;
  if (outEl) outEl.textContent = out;
}

function renderStockTable(stock) {
  const tbody = document.getElementById('stockTableBody');
  if (!tbody) return;
  tbody.closest('table').classList.add('table-card-mobile');
  if (!stock.length) {
    tbody.innerHTML = `<tr><td colspan="8" data-label=""><div class="empty-state"><i class="bi bi-boxes"></i>ยังไม่มีรายการอะไหล่</div></td></tr>`;
    return;
  }
  tbody.innerHTML = stock.map(s => {
    const qty = parseFloat(s.qty) || 0;
    const minQty = parseFloat(s.minQty) || 0;
    let statusBadgeHtml, rowStyle = '';
    if (qty <= 0) {
      statusBadgeHtml = '<span class="badge-status" style="background:rgba(192,80,80,0.15);color:var(--claude-danger)"><i class="bi bi-x-circle"></i>หมดสต็อก</span>';
      rowStyle = 'background:rgba(192,80,80,0.04)';
    } else if (minQty > 0 && qty <= minQty) {
      statusBadgeHtml = '<span class="badge-status status-waiting low-stock-badge"><i class="bi bi-exclamation-triangle"></i>ใกล้หมด</span>';
      rowStyle = 'background:rgba(212,160,68,0.04)';
    } else {
      statusBadgeHtml = '<span class="badge-status status-done"><i class="bi bi-check-circle"></i>มีพอ</span>';
    }
    return `<tr style="${rowStyle}">
      <td data-label="รหัสอะไหล่" class="text-muted small">${s.partCode || '—'}</td>
      <td data-label="ชื่ออะไหล่" class="fw-semibold">${s.partName}</td>
      <td data-label="หน่วย">${s.unit}</td>
      <td data-label="คงเหลือ" class="text-end fw-bold ${qty <= 0 ? 'text-danger' : qty <= minQty ? 'text-warning' : ''}">${qty}</td>
      <td data-label="ขั้นต่ำ" class="text-end text-muted">${minQty}</td>
      <td data-label="ที่เก็บ" class="text-muted small">${s.location || '—'}</td>
      <td data-label="สถานะ">${statusBadgeHtml}</td>
      <td data-label="" class="text-center">
        <div class="d-flex gap-1 justify-content-center">
          <button class="btn btn-sm btn-outline-secondary" onclick="viewPartHistory('${s.partName.replace(/'/g, "\\'")}')" title="ประวัติความเคลื่อนไหว"><i class="bi bi-clock-history"></i></button>
          ${currentUser?.role === 'admin' ? `
            <button class="btn btn-sm btn-outline-primary" onclick="showStockForm('${s.id}')" title="แก้ไข"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-danger" onclick="deleteStockItem('${s.id}')" title="ลบ"><i class="bi bi-trash"></i></button>
          ` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

function filterStock() {
  const searchEl = document.getElementById('stockSearch');
  const filterEl = document.getElementById('stockStatusFilter');
  if (!searchEl || !filterEl) return;
  const q = searchEl.value.toLowerCase();
  const f = filterEl.value;
  renderStockTable(allStock.filter(s => {
    const qOk = !q || s.partName.toLowerCase().includes(q) || (s.partCode || '').toLowerCase().includes(q);
    const qty = parseFloat(s.qty) || 0, minQty = parseFloat(s.minQty) || 0;
    const sOk = !f ||
      (f === 'out' && qty <= 0) ||
      (f === 'low' && qty > 0 && qty <= minQty && minQty > 0) ||
      (f === 'ok' && qty > minQty);
    return qOk && sOk;
  }));
}

function applyStockPreset(kind) {
  const search = document.getElementById('stockSearch');
  const status = document.getElementById('stockStatusFilter');
  if (!search || !status) return;
  search.value = '';
  status.value = kind === 'clear' ? '' : kind;
  filterStock();
}

function showStockForm(id = null) {
  const list = document.getElementById('stockListView');
  const form = document.getElementById('stockFormView');
  const deduct = document.getElementById('stockDeductView');
  if (list) list.classList.add('d-none');
  if (form) form.classList.remove('d-none');
  if (deduct) deduct.classList.add('d-none');

  const itemId = document.getElementById('stockItemId');
  const partCode = document.getElementById('stockPartCode');
  const partName = document.getElementById('stockPartName');
  const unit = document.getElementById('stockUnit');
  const qty = document.getElementById('stockQty');
  const minQty = document.getElementById('stockMinQty');
  const location = document.getElementById('stockLocation');
  const note = document.getElementById('stockNote');

  if (itemId) itemId.value = '';
  if (partCode) { partCode.value = ''; partCode.placeholder = 'กำลังโหลดรหัส...'; }
  if (partName) partName.value = '';
  if (unit) unit.value = 'ชิ้น';
  if (qty) qty.value = 0;
  if (minQty) minQty.value = 0;
  if (location) location.value = '';
  if (note) note.value = '';

  const formTitle = document.getElementById('stockFormTitle');
  const breadcrumb = document.getElementById('stockFormBreadcrumb');

  if (id) {
    if (formTitle) formTitle.textContent = 'แก้ไขอะไหล่';
    const s = allStock.find(x => x.id === id);
    if (s) {
      if (breadcrumb) breadcrumb.textContent = s.partCode || s.partName || 'แก้ไข';
      if (itemId) itemId.value = s.id;
      if (partCode) {
        partCode.value = s.partCode || '';
        partCode.placeholder = 'รหัสอะไหล่';
      }
      if (partName) partName.value = s.partName;
      if (unit) unit.value = s.unit || '';
      if (qty) qty.value = s.qty || 0;
      if (minQty) minQty.value = s.minQty || 0;
      if (location) location.value = s.location || '';
      if (note) note.value = s.note || '';
    }
  } else {
    if (formTitle) formTitle.textContent = 'เพิ่มอะไหล่ใหม่';
    if (breadcrumb) breadcrumb.textContent = 'ใหม่';
    // เพิ่มใหม่ — ดึงรหัสล่วงหน้า
    google.script.run
      .withSuccessHandler(code => {
        const pc = document.getElementById('stockPartCode');
        if (pc) pc.placeholder = code + ' (อัตโนมัติ)';
      })
      .withFailureHandler(() => {
        const pc = document.getElementById('stockPartCode');
        if (pc) pc.placeholder = 'กรอกรหัส หรือปล่อยว่างให้ระบบสร้าง';
      })
      .generatePartCode();
  }
}

function saveStockItem() {
  const itemId = document.getElementById('stockItemId');
  const partCode = document.getElementById('stockPartCode');
  const partName = document.getElementById('stockPartName');
  const unit = document.getElementById('stockUnit');
  const qty = document.getElementById('stockQty');
  const minQty = document.getElementById('stockMinQty');
  const location = document.getElementById('stockLocation');
  const note = document.getElementById('stockNote');

  const item = {
    id: itemId ? itemId.value : '',
    partCode: partCode ? partCode.value : '',
    partName: partName ? partName.value : '',
    unit: unit ? unit.value : '',
    qty: qty ? (parseFloat(qty.value) || 0) : 0,
    minQty: minQty ? (parseFloat(minQty.value) || 0) : 0,
    location: location ? location.value : '',
    note: note ? note.value : ''
  };
  if (!item.partName) { showToast('warning', 'กรุณากรอกชื่ออะไหล่'); return; }
  showLoading('กำลังบันทึก...');
  google.script.run
    .withSuccessHandler(res => {
      Swal.close();
      if (res.success) {
        showToast('success', `บันทึกเรียบร้อย${res.partCode ? ' | รหัส: ' + res.partCode : ''}`);
        loadStock();
      } else { showToast('error', res.message); }
    })
    .withFailureHandler(e => { Swal.close(); showToast('error', e.message); })
    .saveStockItem(item);
}

function deleteStockItem(id) {
  confirmAction('ลบรายการอะไหล่นี้?', () => {
    showLoading('กำลังลบ...');
    google.script.run
      .withSuccessHandler(res => {
        Swal.close();
        if (res.success) { showToast('success', 'ลบเรียบร้อย'); loadStock(); }
        else { showToast('error', res.message); }
      })
      .withFailureHandler(e => { Swal.close(); showToast('error', e.message); })
      .deleteStockItem(id);
  });
}

function showDeductForm() {
  const list = document.getElementById('stockListView');
  const form = document.getElementById('stockFormView');
  const deduct = document.getElementById('stockDeductView');
  if (list) list.classList.add('d-none');
  if (form) form.classList.add('d-none');
  if (deduct) deduct.classList.remove('d-none');

  deductRows = [];
  const dDate = document.getElementById('deductDate');
  const dPlate = document.getElementById('deductPlate');
  const dNote = document.getElementById('deductNote');
  const dSummary = document.getElementById('deductSummary');

  if (dDate) dDate.value  = todayISO();
  if (dPlate) dPlate.value = '';
  if (dNote) dNote.value  = '';

function openDeductPicker() {
  // ย้าย modal ออกมาที่ body ก่อนเสมอ
  const modal = document.getElementById('poPartPickerModal');
  if (modal && modal.parentElement !== document.body) {
    document.body.appendChild(modal);
  }

  selectedPOPartIds.clear();
  document.getElementById('poPartPickerSearch').value = '';
  document.getElementById('poPartPickerCustom').value = '';
  document.getElementById('poPartPickerSelectAll').checked = false;
  updatePOPartPickerCount();

  // โหลด stock ถ้ายังไม่มี
  if (!allStock.length) {
    showLoading('กำลังโหลดรายการอะไหล่...');
    google.script.run
      .withSuccessHandler(stock => {
        Swal.close();
        allStock = stock || [];
        renderPOPartPickerTable(allStock);
      })
      .withFailureHandler(err => {
        Swal.close();
        showToast('error', 'โหลด Stock ไม่สำเร็จ');
      })
      .getStock();
  } else {
    renderPOPartPickerTable(allStock);
  }

  // override confirm button ให้ชี้ไป confirmDeductPicker
  document.getElementById('confirmPOPartPickBtn').onclick = confirmDeductPicker;
  new bootstrap.Modal(modal).show();
}

function confirmDeductPicker() {
  const picked = allStock.filter(s => selectedPOPartIds.has(s.id));
  picked.forEach(s => {
    if (!deductRows.find(r => r.stockId === s.id)) {
      deductRows.push({
        stockId : s.id,
        partName: s.partName,
        currentQty: parseFloat(s.qty) || 0,
        unit    : s.unit || 'ชิ้น',
        qty     : 1,
        pricePerUnit: s.lastPrice || 0
      });
    }
  });
  renderDeductItems();
  selectedPOPartIds.clear();
  // reset confirm button กลับ
  document.getElementById('confirmPOPartPickBtn').onclick = confirmPOMultiPick;
  bootstrap.Modal.getInstance(document.getElementById('poPartPickerModal')).hide();
}

function renderDeductItems() {
  const tbody = document.getElementById('deductItemsBody');
  if (!tbody) return;
  tbody.closest('table').classList.add('table-card-mobile');
  if (!deductRows.length) {
    tbody.innerHTML = `<tr id="deductEmptyRow">
      <td colspan="7" data-label="" class="text-center text-muted py-3">กดเลือกจาก Stock ด้านบน</td>
    </tr>`;
    return;
  }
  tbody.innerHTML = deductRows.map((r, i) => {
    const overQty = r.qty > r.currentQty;
    return `<tr>
      <td data-label="ลำดับ" class="text-muted">${i + 1}</td>
      <td data-label="ชื่ออะไหล่" class="fw-semibold">${r.partName}</td>
      <td data-label="คงเหลือ" class="text-end ${r.currentQty <= 0 ? 'text-danger' : 'text-muted'}">
        ${r.currentQty}
      </td>
      <td data-label="ตัดออก">
        <input type="number" class="form-control form-control-sm text-center
          ${overQty ? 'border-danger' : ''}"
          value="${r.qty}" min="0.01" step="0.01"
          style="width:75px"
          onchange="deductRows[${i}].qty=parseFloat(this.value)||0;renderDeductItems()">
        ${overQty ? `<div class="text-danger" style="font-size:10px">เกินคงเหลือ</div>` : ''}
      </td>
      <td data-label="ราคา/หน่วย">
        <!-- ✅ เพิ่มช่องราคา -->
        <input type="number" class="form-control form-control-sm text-end"
          value="${r.pricePerUnit || 0}" min="0" step="0.01"
          style="width:90px"
          placeholder="ราคา/หน่วย"
          onchange="deductRows[${i}].pricePerUnit=parseFloat(this.value)||0">
      </td>
      <td data-label="หน่วย" class="text-muted">${r.unit}</td>
      <td data-label="">
        <button class="btn btn-sm btn-outline-danger"
          onclick="deductRows.splice(${i},1);renderDeductItems()">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>`;
  }).join('');
}

function confirmDeductStock() {
  const dDate = document.getElementById('deductDate');
  const dPlate = document.getElementById('deductPlate');
  const dNote = document.getElementById('deductNote');

  const date  = dDate ? dDate.value : '';
  const plate = dPlate ? dPlate.value.trim() : '';
  const note  = dNote ? dNote.value.trim() : '';

  if (!date)           { showToast('warning', 'กรุณาเลือกวันที่');      return; }
  if (!plate)          { showToast('warning', 'กรุณาระบุทะเบียนรถ');   return; }
  if (!deductRows.length) { showToast('warning', 'กรุณาเลือกอะไหล่');  return; }

  const overLimit = deductRows.find(r => r.qty > r.currentQty);
  const confirmText = overLimit
    ? `<div class="text-danger small mb-2">
         <i class="bi bi-exclamation-triangle me-1"></i>
         มีรายการที่ตัดเกินจำนวนคงเหลือ ระบบจะตัดจนเหลือ 0
       </div>`
    : '';

  Swal.fire({
    title: 'ยืนยันตัดอะไหล่?',
    html: `${confirmText}
      <div style="font-size:13px;text-align:left">
        <div><b>วันที่:</b> ${formatDate(date)}</div>
        <div><b>ทะเบียน:</b> ${plate}</div>
        <div><b>จำนวน:</b> ${deductRows.length} รายการ</div>
        ${note ? `<div><b>หมายเหตุ:</b> ${note}</div>` : ''}
      </div>`,
    icon: overLimit ? 'warning' : 'question',
    showCancelButton: true,
    confirmButtonText: 'ยืนยัน',
    cancelButtonText: 'ยกเลิก',
    confirmButtonColor: 'var(--claude-danger)'
  }).then(r => {
    if (!r.isConfirmed) return;
    showLoading('กำลังตัดอะไหล่...');
    google.script.run
      .withSuccessHandler(res => {
        Swal.close();
        if (!res.success) { showToast('error', res.message); return; }

        // แสดงสรุป
        const summaryEl = document.getElementById('deductSummary');
        const summaryListEl = document.getElementById('deductSummaryList');
        if (summaryListEl) {
          summaryListEl.innerHTML = res.results.map(r => r.error
            ? `<div class="text-danger">❌ ${r.partName}: ${r.error}</div>`
            : `<div>✅ ${r.partName}: ${r.before} → <b>${r.after}</b></div>`
          ).join('');
        }
        if (summaryEl) summaryEl.classList.remove('d-none');

        showToast('success', `ตัดอะไหล่ ${deductRows.length} รายการเรียบร้อย`);
        deductRows = [];
        renderDeductItems();
        loadStock(); // refresh ตาราง
      })
      .withFailureHandler(e => { Swal.close(); showToast('error', e.message); })
      .manualDeductStock(
        deductRows.map(r => ({ stockId: r.stockId, partName: r.partName, qty: r.qty, pricePerUnit: r.pricePerUnit })),
        date, plate, note
      );
  });
}

function cancelDeduct(logId, partName, qty) {
  confirmAction(
    `ยกเลิกการตัด "${partName}" จำนวน ${qty} รายการ?\nระบบจะบวกจำนวนคืนใน Stock`, 
    () => {
      showLoading('กำลังยกเลิก...');
      google.script.run
        .withSuccessHandler(res => {
          Swal.close();
          if (res.success) {
            showToast('success', `คืน ${res.partName} ${res.qty} รายการเรียบร้อย`);
            loadStock();      // refresh ตาราง stock
            loadStockLog();   // refresh log
          } else {
            showToast('error', res.message);
          }
        })
        .withFailureHandler(e => { Swal.close(); showToast('error', e.message); })
        .cancelDeductStock(logId);
    }
  );
}

function loadStockLog() {
  document.getElementById('stockLogBody').innerHTML =
    '<tr><td colspan="6" class="text-center text-muted py-2 small">กำลังโหลด...</td></tr>';

  google.script.run
    .withSuccessHandler(logs => {
      const tbody = document.getElementById('stockLogBody');
      tbody.closest('table').classList.add('table-card-mobile');

      if (!logs.length) {
        tbody.innerHTML = '<tr><td colspan="6" data-label="" class="text-center text-muted py-3">ยังไม่มีประวัติ</td></tr>';
        return;
      }

      const typeLabel = {
        'IN'         : { label: 'รับเข้า',         cls: 'status-done',       icon: 'box-arrow-in-down' },
        'OUT'        : { label: 'ตัดออก(ซ่อม)',    cls: 'status-inprogress', icon: 'box-arrow-up'      },
        'OUT-MANUAL' : { label: 'ตัดออก(manual)',  cls: 'status-waiting',    icon: 'scissors'          },
        'CANCEL'     : { label: 'ยกเลิก',          cls: 'status-approved',   icon: 'arrow-counterclockwise' },
        'LINE_REG'   : { label: 'ลงทะเบียน Line', cls: 'status-approved',   icon: 'line'              }
      };

      tbody.innerHTML = logs.map(l => {
        const t = typeLabel[l.type] || { label: l.type, cls: 'status-waiting-parts', icon: 'question' };
        
        // ✅ แสดงปุ่มยกเลิกเฉพาะ OUT-MANUAL และมี logId
        const cancelBtn = (l.type === 'OUT-MANUAL' && l.logId)
          ? `<button class="btn btn-sm btn-outline-danger" 
              onclick="cancelDeduct('${l.logId}','${l.partName}',${l.qty})"
              title="ยกเลิกรายการนี้">
              <i class="bi bi-arrow-counterclockwise"></i>
            </button>`
          : '';

        return `<tr>
          <td data-label="วันที่/เวลา" class="text-muted small">${formatDate(l.timestamp)}</td>
          <td data-label="ประเภท">
            <span class="badge-status ${t.cls}">
              <i class="bi bi-${t.icon}"></i>${t.label}
            </span>
          </td>
          <td data-label="อะไหล่" class="fw-semibold">${l.partName}</td>
          <td data-label="จำนวน" class="fw-bold text-end">${l.qty}</td>
          <td data-label="อ้างอิง" class="text-muted small">${l.ref}</td>
          <td>${cancelBtn}</td>
        </tr>`;
      }).join('');
    })

        `<tr><td colspan="6" class="text-center text-danger py-2 small">${e.message}</td></tr>`;
    })
    .getStockLog(50);  // โหลด 50 รายการล่าสุด
}

function viewPartHistory(partName) {
  showLoading('กำลังดึงข้อมูลประวัติอะไหล่...');
  
  google.script.run
    .withSuccessHandler(logs => {
      Swal.close();
      
      // ฟิลเตอร์เฉพาะรายการของอะไหล่ชิ้นนี้ (case-insensitive)
      const filteredLogs = logs.filter(l => String(l.partName || '').trim().toLowerCase() === partName.trim().toLowerCase());
      
      if (!filteredLogs.length) {
        Swal.fire({
          icon: 'info',
          title: 'ไม่พบประวัติ',
          text: `ไม่พบประวัติความเคลื่อนไหวของอะไหล่ "${partName}"`,
          confirmButtonColor: '#3B82F6'
        });
        return;
      }
      
      let tableRows = '';
      
      filteredLogs.forEach(l => {
        let typeBadge = '';
        let rowColor = '';
        let details = '';
        
        if (l.type === 'IN') {
          typeBadge = '<span class="badge bg-success-light text-success"><i class="bi bi-box-arrow-in-down me-1"></i> รับเข้า</span>';
          rowColor = 'background-color: rgba(16, 185, 129, 0.04)';
          
          // ค้นหาข้อมูลร้านค้า / ทะเบียนรถจาก PO
          const poNo = String(l.ref || '').replace('PO: ', '').trim();
          const po = allPOs.find(p => p.poNo === poNo);
          if (po) {
            details = `นำเข้าจาก <b>${po.shopName || 'ร้านค้า'}</b>`;
            if (po.plate) details += ` (สั่งให้รถทะเบียน: <b>${po.plate}</b>)`;
          } else {
            details = `สั่งซื้อ: <b>${l.ref}</b>`;
          }
          
        } else if (l.type === 'OUT') {
          typeBadge = '<span class="badge bg-danger-light text-danger"><i class="bi bi-box-arrow-up me-1"></i> ตัดออก (ซ่อม)</span>';
          rowColor = 'background-color: rgba(239, 68, 68, 0.04)';
          
          // ค้นหาข้อมูลทะเบียนรถจากใบแจ้งซ่อม (Repair)
          const repairNo = String(l.ref || '').replace('Repair: ', '').trim();
          const rep = allRepairs.find(r => r.repairNo === repairNo);
          if (rep) {
            details = `ติดตั้งให้กับรถทะเบียน: <span class="badge bg-dark-light text-dark fw-bold">${rep.plate}</span><br>ใบซ่อม: <b>${repairNo}</b> (อาการ: ${rep.repairList || '—'})`;
          } else {
            details = `งานซ่อม: <b>${l.ref}</b>`;
          }
          
        } else if (l.type === 'OUT-MANUAL') {
          typeBadge = '<span class="badge bg-warning-light text-warning"><i class="bi bi-scissors me-1"></i> เบิกออก (ทั่วไป)</span>';
          rowColor = 'background-color: rgba(245, 158, 11, 0.04)';
          
          // แกะรายละเอียดจาก ref: วันที่:xxxx | ทะเบียน:xxxx | ราคา:xxxx | หมายเหตุ:xxxx
          const refStr = String(l.ref || '');
          let plate = '';
          let note = '';
          const parts = refStr.split('|');
          parts.forEach(p => {
            const pair = p.split(':');
            if (pair.length >= 2) {
              const k = pair[0].trim();
              const v = pair.slice(1).join(':').trim();
              if (k === 'ทะเบียน') plate = v;
              if (k === 'หมายเหตุ') note = v;
            }
          });
          
          details = `เบิกไปใช้กับรถทะเบียน: <span class="badge bg-dark-light text-dark fw-bold">${plate || '—'}</span><br>หมายเหตุ: <i>${note || '—'}</i>`;
          
        } else if (l.type === 'CANCEL') {
          typeBadge = '<span class="badge bg-secondary-light text-secondary"><i class="bi bi-arrow-counterclockwise me-1"></i> ยกเลิกเบิก</span>';
          rowColor = 'background-color: rgba(107, 114, 128, 0.04)';
          details = `ยกเลิกการเบิกออกเดิม (ข้อมูลอ้างอิง: <i>${l.ref}</i>)`;
        } else {
          typeBadge = `<span class="badge bg-secondary-light text-secondary">${l.type}</span>`;
          details = l.ref || '—';
        }
        
        tableRows += `
          <tr>
            <td class="text-muted small align-middle" style="font-size: 11px;">${formatDate(l.timestamp)}</td>
            <td class="align-middle">${typeBadge}</td>
            <td class="text-end fw-bold align-middle" style="font-size: 14px; ${rowColor}">${l.qty}</td>
            <td class="small align-middle text-start" style="line-height: 1.4;">${details}</td>
          </tr>
        `;
      });
      
      const htmlContent = `
        <div class="table-responsive text-start" style="max-height: 400px; border-radius: 8px; border: 1px solid #E5E7EB;">
          <table class="table table-hover table-sm mb-0" style="font-size: 13px;">
            <thead class="table-light sticky-top">
              <tr>
                <th style="width: 110px;">วันเวลา</th>

function _applyImagePreview(inputId, imgId, emptyId, url) {
  const img   = document.getElementById(imgId);
  const empty = document.getElementById(emptyId);
  if (!img) return;
  if (url) {
    img.src = url;
    img.style.display = '';
    if (empty) empty.style.display = 'none';
  } else {
    img.style.display = 'none';
    if (empty) empty.style.display = '';
  }
}

// ── parseDriveUrl: แปลง Google Drive share URL → thumbnail URL ──
function parseDriveUrl(url) {
  if (!url) return url;
  const match = url.match(/[-\w]{25,}/);
  if (match) return 'https://drive.google.com/thumbnail?id=' + match[0] + '&sz=w400';
  return url;
}

// ── Preview โลโก้ ──
function previewLogo() {
  _previewImage('settingLogoUrl', 'settingLogoPreview', 'settingLogoEmpty');
}

// ✅ Preview ตราประทับ
function previewStamp() {
  _previewImage('settingStampUrl', 'settingStampPreview', 'settingStampEmpty');
}

function _previewImage(inputId, imgId, emptyId) {
  const input = document.getElementById(inputId);
  const img   = document.getElementById(imgId);
  const empty = document.getElementById(emptyId);
  if (!input || !img) return;
  const rawUrl = input.value.trim();
  if (!rawUrl) {
    img.style.display = 'none';
    if (empty) empty.style.display = '';
    return;
  }
  const formatted = parseDriveUrl(rawUrl);
  input.value = formatted;
  img.onload  = function() { this.style.display = ''; if (empty) empty.style.display = 'none'; };
  img.onerror = function() {
    // fallback
    if (formatted.indexOf('thumbnail') !== -1) {
      const m = formatted.match(/id=([-\w]+)/);
      if (m) { this.src = 'https://drive.google.com/uc?export=view&id=' + m[1]; return; }
    }
    this.style.display = 'none';
    if (empty) empty.style.display = '';
  };
  img.src = formatted;
}

function saveCompanySettings() {
  const map = {
    COMPANY_NAME_EN:    'settingCompanyNameEN',
    COMPANY_NAME_TH:    'settingCompanyNameTH',
    COMPANY_ADDRESS_EN: 'settingCompanyAddressEN',
    COMPANY_ADDRESS_TH: 'settingCompanyAddressTH',
    COMPANY_TEL:        'settingCompanyTel',
    COMPANY_FAX:        'settingCompanyFax',
    COMPANY_TAX_ID:     'settingCompanyTaxId',
    COMPANY_LOGO:       'settingLogoUrl',
    COMPANY_STAMP:      'settingStampUrl'   // ✅
  };
  google.script.run.withSuccessHandler(allSettings => {
    const existing = {};
    (allSettings || []).forEach(s => existing[s.key] = s.value);
    Object.entries(map).forEach(([k, id]) => {
      const el = document.getElementById(id);
      if (el) existing[k] = el.value.trim();
    });
    const merged = Object.entries(existing).map(([key, value]) => ({ key, value }));
    showLoading('กำลังบันทึก...');
    google.script.run
      .withSuccessHandler(res => {
        Swal.close();
        if (res.success) showToast('success', 'บันทึกข้อมูลบริษัทเรียบร้อย');
        else showToast('error', res.message);
      })
      .withFailureHandler(e => { Swal.close(); showToast('error', e.message); })
      .saveSettings(merged);
  }).getAllSettings();
}

// ── BUSES PAGE ──
let allBusesData = [];

function loadBuses() {
  google.script.run.withSuccessHandler(buses => {
    allBusesData = buses || [];
    allBuses = buses.map(b => ({ plate: b.plate, chassis: b.chassis }));
    // Load repairs first for status, then render
    if (allRepairs.length) {
      updateBusStats(buses);
      renderBuses(buses);
    } else {
      google.script.run.withSuccessHandler(repairs => {
        allRepairs = repairs || [];
        updateBusStats(buses);
        renderBuses(buses);
      }).getRepairs();
    }
  }).getFullBuses();
}

function updateBusStats(buses) {
  const total = buses.length;
  const inRepair   = buses.filter(b => allRepairs.find(x => x.plate === b.plate && ['กำลังดำเนินการ','อนุมัติซ่อม','รอซ่อม'].includes(x.status))).length;
  const waitParts  = buses.filter(b => allRepairs.find(x => x.plate === b.plate && x.status === 'รออะไหล่')).length;
  document.getElementById('busTotalCount').textContent   = total;
  document.getElementById('busInRepair').textContent     = inRepair;
  document.getElementById('busWaitingParts').textContent = waitParts;
  document.getElementById('busReady').textContent        = Math.max(0, total - inRepair - waitParts);
}

function filterBuses() {
  const q = document.getElementById('busSearch').value.toLowerCase();
  renderBuses(allBusesData.filter(b =>
    !q || b.plate.toLowerCase().includes(q) ||
    (b.chassis||'').toLowerCase().includes(q) ||
    (b.model||'').toLowerCase().includes(q)
  ));
}

function setBusView(mode) {
  document.getElementById('busTableView').classList.toggle('d-none', mode !== 'table');
  document.getElementById('busCardView').classList.toggle('d-none',  mode !== 'card');

  document.getElementById('viewCardBtn').classList.toggle('active',  mode === 'card');
}

function renderBuses(buses) { renderBusTable(buses); renderBusCards(buses); }

function getBusStatusForPlate(plate) {
  const active = allRepairs.filter(r => r.plate === plate && r.status !== 'เสร็จแล้ว');
  if (active.find(r => r.status === 'รออะไหล่'))       return { label: 'รออะไหล่',        cls: 'status-waiting-parts' };
  if (active.find(r => r.status === 'กำลังดำเนินการ')) return { label: 'กำลังซ่อม',        cls: 'status-inprogress'   };
  if (active.find(r => r.status === 'อนุมัติซ่อม'))    return { label: 'อนุมัติซ่อมแล้ว', cls: 'status-approved'     };
  if (active.find(r => r.status === 'รอซ่อม'))          return { label: 'รอซ่อม',           cls: 'status-waiting'      };
  return { label: 'พร้อมใช้งาน', cls: 'status-done' };
}

function busExpiryTag(dateStr) {
  if (!dateStr) return '—';
  try {
    const diffDays = Math.ceil((new Date(dateStr) - new Date()) / 86400000);
    if (diffDays < 0)   return '<span class="badge-status" style="background:rgba(192,80,80,.15);color:var(--claude-danger);font-size:11px"><i class="bi bi-exclamation-circle me-1"></i>หมดอายุแล้ว</span>';
    if (diffDays <= 30) return '<span class="badge-status status-waiting" style="font-size:11px"><i class="bi bi-exclamation-triangle me-1"></i>อีก ' + diffDays + ' วัน</span>';
    return '<span class="text-muted small">' + formatDate(dateStr) + '</span>';
  } catch(e) { return dateStr; }
}
