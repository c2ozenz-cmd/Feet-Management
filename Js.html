function saveBusFromPage() {
  var plate = document.getElementById('busPlate').value.trim();
  if (!plate) { showToast('warning', 'กรุณากรอกป้ายทะเบียน'); return; }
  var bus = {
    oldPlate:         document.getElementById('editBusOldPlate').value,
    plate:            plate,
    chassis:          document.getElementById('busChassis').value,
    model:            document.getElementById('busModel').value,
    year:             document.getElementById('busYear').value,
    color:            document.getElementById('busColor').value,
    engineNo:         document.getElementById('busEngineNo').value,
    lastInspect:      document.getElementById('busLastInspect').value,
    regExpiry:        document.getElementById('busRegExpiry').value,
    insuranceExpiry:  document.getElementById('busInsuranceExpiry').value,
    note:             document.getElementById('busNote').value
  };
  showLoading('กำลังบันทึก...');
  google.script.run
    .withSuccessHandler(function(res) {
      Swal.close();
      if (res.success) {
        showToast('success', 'บันทึกข้อมูลรถบัสเรียบร้อย');
        bootstrap.Modal.getInstance(document.getElementById('busModal')).hide();
        loadBuses();
        loadBusPlates();
      } else { showToast('error', res.message); }
    })
    .withFailureHandler(function(e) { Swal.close(); showToast('error', e.message); })
    .saveBus(bus);
}

function deleteBus(plate) {
  confirmAction('ลบทะเบียนรถ "' + plate + '" ออกจากระบบ?', function() {
    showLoading('กำลังลบ...');
    google.script.run
      .withSuccessHandler(function(res) {
        Swal.close();
        if (res.success) { showToast('success', 'ลบเรียบร้อย'); loadBuses(); loadBusPlates(); }
        else showToast('error', res.message);
      })
      .withFailureHandler(function(e) { Swal.close(); showToast('error', e.message); })
      .deleteBus(plate);
  });
}

function showBusHistory(plate) {
  document.getElementById('busHistoryPlate').textContent = plate;
  var history = allRepairs.filter(function(r) { return r.plate === plate; })
    .sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
  document.getElementById('busHistoryBody').innerHTML = history.length
    ? history.map(function(r) {
        return '<tr>' +
          '<td><span class="fw-semibold" style="color:var(--claude-primary)">' + r.repairNo + '</span></td>' +
          '<td>' + formatDate(r.date) + '</td>' +
          '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + r.repairList + '</td>' +
          '<td class="text-end">' + (r.mileage ? Number(r.mileage).toLocaleString() : '—') + '</td>' +
          '<td>' + statusBadge(r.status) + '</td>' +
        '</tr>';
      }).join('')
    : '<tr><td colspan="5"><div class="empty-state" style="padding:24px"><i class="bi bi-tools"></i>ยังไม่มีประวัติการซ่อม</div></td></tr>';
  new bootstrap.Modal(document.getElementById('busHistoryModal')).show();
}

// ── PART PICKER (Multi-Select) ──
let selectedPartIds = new Set();

function openPartPicker() {
  window._partPickerMode = 'repair';
  selectedPartIds.clear();
  document.getElementById('partPickerSearch').value = '';
  document.getElementById('partPickerCustom').value = '';
  document.getElementById('partPickerSelectAll').checked = false;
  updatePartPickerCount();
  renderPartPickerTable(allStock);

  // ── Dispose instance เก่าก่อนเสมอ ──
  const modalEl = document.getElementById('partPickerModal');
  const oldInstance = bootstrap.Modal.getInstance(modalEl);
  if (oldInstance) oldInstance.dispose();

  new bootstrap.Modal(modalEl).show();
}

function filterPartPicker() {
  const q = document.getElementById('partPickerSearch').value.toLowerCase();
  renderPartPickerTable(
    allStock.filter(s =>
      s.partName.toLowerCase().includes(q) ||
      (s.partCode || '').toLowerCase().includes(q)
    )
  );
  // sync select-all checkbox
  syncSelectAllCheckbox();
}

function renderPartPickerTable(list) {
  const tbody = document.getElementById('partPickerBody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">ไม่พบอะไหล่</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(s => {
    const qty = parseFloat(s.qty) || 0;
    const qtyColor = qty <= 0
      ? 'color:var(--claude-danger)'
      : qty <= (parseFloat(s.minQty) || 0)
        ? 'color:var(--claude-warning)'
        : 'color:var(--claude-success)';
    const checked = selectedPartIds.has(s.id) ? 'checked' : '';
    const rowStyle = selectedPartIds.has(s.id)
      ? 'background:rgba(var(--claude-primary-rgb,61,90,254),0.07)'
      : '';
    return `<tr style="${rowStyle}">
      <td>
        <input type="checkbox" value="${s.id}" ${checked}
          onchange="togglePartSelect('${s.id}', this.checked)">
      </td>
      <td class="text-muted small">${s.partCode || '—'}</td>
      <td class="fw-semibold">${s.partName}</td>
      <td class="text-end fw-bold" style="${qtyColor}">${qty}</td>
      <td>${s.unit || ''}</td>
    </tr>`;
  }).join('');
}

function togglePartSelect(id, checked) {
  checked ? selectedPartIds.add(id) : selectedPartIds.delete(id);
  updatePartPickerCount();
  syncSelectAllCheckbox();
  // อัป row highlight
  renderPartPickerTable(getCurrentPickerList());
}

function toggleSelectAllParts(checkbox) {
  const list = getCurrentPickerList();
  list.forEach(s => {
    checkbox.checked
      ? selectedPartIds.add(s.id)
      : selectedPartIds.delete(s.id);
  });
  updatePartPickerCount();
  renderPartPickerTable(list);
}

function syncSelectAllCheckbox() {
  const list = getCurrentPickerList();
  const allChecked = list.length > 0 && list.every(s => selectedPartIds.has(s.id));
  document.getElementById('partPickerSelectAll').checked = allChecked;
}

function getCurrentPickerList() {
  const q = document.getElementById('partPickerSearch').value.toLowerCase();
  return !q
    ? allStock
    : allStock.filter(s =>
        s.partName.toLowerCase().includes(q) ||
        (s.partCode || '').toLowerCase().includes(q)
      );
}

function updatePartPickerCount() {
  const n = selectedPartIds.size;
  document.getElementById('partPickerSelectedCount').textContent = `เลือก ${n} รายการ`;
  const btn = document.getElementById('confirmPartPickBtn');
  btn.textContent = `เพิ่มรายการที่เลือก (${n})`;
  btn.disabled = n === 0;
  // เพิ่ม icon กลับ (textContent เขียนทับ)
  btn.innerHTML = `<i class="bi bi-check-lg me-1"></i>เพิ่มรายการที่เลือก (${n})`;
}

function confirmMultiPick() {
  if (window._partPickerMode === 'oil') {
    return;
  }
  // โค้ดเดิมของ Repair
  const picked = allStock.filter(s => selectedPartIds.has(s.id));
  picked.forEach(s => {
    const exists = repairPartRows.find(r => r.partName === s.partName);
    if (!exists) {
      repairPartRows.push({ partName: s.partName, partCode: s.partCode || '', qty: 1 });
    }
  });
  renderRepairParts();
  selectedPartIds.clear();
  bootstrap.Modal.getInstance(document.getElementById('partPickerModal')).hide();
}

function pickCustomPart() {
  const name = document.getElementById('partPickerCustom').value.trim();
  if (!name) return;
  const exists = repairPartRows.find(r => r.partName === name);
  if (!exists) {
    repairPartRows.push({ partName: name, partCode: '', qty: 1 });
  }
  renderRepairParts();
  document.getElementById('partPickerCustom').value = '';
  bootstrap.Modal.getInstance(document.getElementById('partPickerModal')).hide();
}

    showLoading('กำลังลบ...');

      .deleteShop(id);

}

// ── GENERIC COMBOBOX ──
function showComboList(inputId, listId, data, field) {
  const input = document.getElementById(inputId);
  const list  = document.getElementById(listId);
  if (!input || !list) return;

  const q = input.value.toLowerCase().trim();
  if (!q) { closeComboList(listId); return; }

  const filtered = data
    .filter(item => String(item[field] || '').toLowerCase().includes(q))
    .slice(0, 50);

  if (!filtered.length) { closeComboList(listId); return; }

  list.innerHTML = filtered.map(item => {
    const val = String(item[field] || '');
    const highlighted = val.replace(
      new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),
      '<mark>$1</mark>'
    );
    return `<li onmousedown="selectCombo('${inputId}','${listId}','${val.replace(/'/g,"\\'")}')">
      ${highlighted}
    </li>`;
  }).join('');

  list.classList.add('show');
}

function selectCombo(inputId, listId, value) {
  const input = document.getElementById(inputId);
  if (input) {
    input.value = value;
    input.dispatchEvent(new Event('change'));
  }
  closeComboList(listId);
}

function closeComboList(listId) {
  const list = document.getElementById(listId);
  if (list) list.classList.remove('show');
}

// ปิดทุก combo เมื่อคลิกที่อื่น
document.addEventListener('click', e => {
  document.querySelectorAll('.combo-list.show').forEach(list => {
    if (!list.closest('.combo-wrapper')?.contains(e.target)) {
      list.classList.remove('show');
    }
  });
});

function loadOilTemplate() {
  // ── ย้าย poPartPickerModal ออกมาที่ body โดยตรง ──
  const modal = document.getElementById('poPartPickerModal');
  if (modal && modal.parentElement.id !== 'body' && modal.parentElement !== document.body) {
    document.body.appendChild(modal);
  }

  // โหลด bus plates สำหรับ dropdown
  google.script.run.withSuccessHandler(buses => {
    const sel = document.getElementById('oilPlateSelect');
    sel.innerHTML = '<option value="">-- เลือกทะเบียน --</option>' +
      buses.map(b => `<option value="${b.plate}">${b.plate}</option>`).join('');
  }).getBusPlates();
}

function loadOilTemplateItems() {
  const plate   = document.getElementById('oilPlateSelect').value;
  const program = document.getElementById('oilProgramSelect').value;
  if (!plate || !program) {
    showToast('warning', 'กรุณาเลือกทะเบียนและโปรแกรม');
    return;
  }

  showLoading('กำลังโหลด...');
  google.script.run
    .withSuccessHandler(items => {
      Swal.close();
      oilTemplateRows = items.length
        ? items.map(i => ({
            partName    : i.partName,
            qty         : i.qty,
            unit        : i.unit,
            pricePerUnit: i.pricePerUnit || 0
          }))
        : [];
      renderOilTemplateTable();
      showToast(
        items.length ? 'success' : 'info',
        items.length
          ? `โหลด ${items.length} รายการ`
          : 'ยังไม่มีข้อมูล กรุณาเพิ่มรายการ'
      );
    })
    .withFailureHandler(e => { Swal.close(); showToast('error', e.message); })
    .getOilTemplateByPlateProgram(plate, program);
}

function renderOilTemplateTable() {
  const tbody = document.getElementById('oilTemplateBody');
  const info  = document.getElementById('oilTemplateInfo');

  if (!oilTemplateRows.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">
      ยังไม่มีรายการ กดเพิ่มรายการด้านล่าง
    </td></tr>`;
    if (info) info.textContent = '';
    calcOilTemplateTotal();
    return;
  }

  if (info) info.textContent = `(${oilTemplateRows.length} รายการ)`;

  tbody.innerHTML = oilTemplateRows.map((r, i) => {
    const rowTotal = (parseFloat(r.qty) || 0) * (parseFloat(r.pricePerUnit) || 0);
    return `
    <tr>
      <td class="text-muted text-center">${i + 1}</td>
      <td>
        <div class="input-group input-group-sm">
          <input type="text" class="form-control"
            value="${r.partName || ''}"
            onchange="oilTemplateRows[${i}].partName=this.value"
            placeholder="ชื่ออะไหล่">
        </div>
      </td>
      <td>
        <input type="number" class="form-control form-control-sm text-center"
          value="${r.qty}" min="0" step="0.01"
          onchange="oilTemplateRows[${i}].qty=parseFloat(this.value)||0;renderOilTemplateTable()"
          style="width:70px">
      </td>
      <td>
        <input type="text" class="form-control form-control-sm text-center"
          value="${r.unit || 'ชิ้น'}"
          onchange="oilTemplateRows[${i}].unit=this.value"
          style="width:65px">
      </td>
      <td>
        <input type="number" class="form-control form-control-sm text-end"
          value="${r.pricePerUnit || 0}" min="0" step="0.01"
          onchange="oilTemplateRows[${i}].pricePerUnit=parseFloat(this.value)||0;renderOilTemplateTable()"
          style="width:90px">
      </td>
      <td class="text-end fw-semibold" style="font-size:12px;color:var(--claude-primary)">
        ${rowTotal > 0 ? fmtNum(rowTotal) : '<span class="text-muted">—</span>'}
      </td>
      <td class="text-center">
        <button class="btn btn-sm btn-outline-danger"
          onclick="oilTemplateRows.splice(${i},1);renderOilTemplateTable()">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>`;
  }).join('');

  calcOilTemplateTotal();
}

function openOilPartPicker() {
  const modal = document.getElementById('poPartPickerModal');
  if (modal && modal.parentElement !== document.body) {
    document.body.appendChild(modal);
  }

  selectedPOPartIds.clear();
  document.getElementById('poPartPickerSearch').value = '';
  document.getElementById('poPartPickerCustom').value = '';
  document.getElementById('poPartPickerSelectAll').checked = false;
  updatePOPartPickerCount();

  if (!allStock.length) {
    showLoading('กำลังโหลดรายการอะไหล่...');
    google.script.run
      .withSuccessHandler(stock => {
        Swal.close();
        allStock = stock || [];
        renderPOPartPickerTable(allStock);
      })
      .withFailureHandler(err => {
        Swal.close();
        showToast('error', 'โหลด Stock ไม่สำเร็จ');
      })
      .getStock();
  } else {
    renderPOPartPickerTable(allStock);
  }

  document.getElementById('confirmPOPartPickBtn').onclick = confirmOilFromPOPicker;
  new bootstrap.Modal(modal).show();
}

function confirmOilFromPOPicker() {
  const picked = allStock.filter(s => selectedPOPartIds.has(s.id));
  picked.forEach(s => {
    if (!oilTemplateRows.find(r => r.partName === s.partName)) {
      oilTemplateRows.push({
        partName    : s.partName,
        qty         : 1,
        unit        : s.unit || 'ชิ้น',
        pricePerUnit: 0
      });
    }
  });
  renderOilTemplateTable();
  selectedPOPartIds.clear();
  document.getElementById('confirmPOPartPickBtn').onclick = confirmPOMultiPick;
  bootstrap.Modal.getInstance(document.getElementById('poPartPickerModal')).hide();
}


function saveOilTemplate() {
  const plate   = document.getElementById('oilPlateSelect').value;
  const program = document.getElementById('oilProgramSelect').value;
  if (!plate || !program) {
    showToast('warning', 'กรุณาเลือกทะเบียนและโปรแกรม'); return;
  }
  if (!oilTemplateRows.length) {
    showToast('warning', 'กรุณาเพิ่มรายการอะไหล่อย่างน้อย 1 รายการ'); return;
  }
  const invalid = oilTemplateRows.find(r => !r.partName);
  if (invalid) {
    showToast('warning', 'กรุณากรอกชื่ออะไหล่ให้ครบ'); return;
  }

  showLoading('กำลังบันทึก...');
  google.script.run
    .withSuccessHandler(res => {
      Swal.close();
      if (res.success) {
        showToast('success',
          `บันทึกโปรแกรม ${program} ของ ${plate} (${oilTemplateRows.length} รายการ)`
        );
      } else {
        showToast('error', res.message);
      }
    })
    .withFailureHandler(e => { Swal.close(); showToast('error', e.message); })
    .saveOilTemplate(plate, program, oilTemplateRows);
}

function calcOilTemplateTotal() {
  const total = oilTemplateRows.reduce((s, r) =>
    s + ((parseFloat(r.qty) || 0) * (parseFloat(r.pricePerUnit) || 0)), 0
  );
  const el = document.getElementById('oilTemplateTotal');
  const foot = document.getElementById('oilTemplateFoot');
  if (el) el.textContent = fmtNum(total);
  if (foot) foot.classList.toggle('d-none', total === 0);

function renderNotificationBell() {
  const unread = allNotifications.filter(n => !readNotifIds.has(n.id));
  const badge  = document.getElementById('notifBadge');
  const list   = document.getElementById('notifList');

  // Badge count
  badge.textContent = unread.length;
  badge.style.display = unread.length ? '' : 'none';

  // Dropdown list
  const iconMap = {
    po_approved    : { icon: 'check-circle-fill', color: '#10B981' },
    repair_approved: { icon: 'wrench-adjustable',  color: '#3B82F6' },
    po_pending     : { icon: 'hourglass-split',    color: '#F59E0B' },
    stock_low      : { icon: 'exclamation-triangle-fill', color: '#EF4444' }
  };

  list.innerHTML = allNotifications.length
    ? allNotifications.slice(0, 10).map(n => {
        const ico     = iconMap[n.type] || { icon: 'bell', color: '#6B7280' };
        const isRead  = readNotifIds.has(n.id);
        return `
        <div class="notif-item ${isRead ? 'read' : 'unread'}"
          onclick="clickNotif('${n.id}','${n.action}','${n.ref}')">
          <div class="notif-icon" style="color:${ico.color}">

            <div class="notif-body">${n.body}</div>
          </div>
          ${!isRead ? '<div class="notif-dot"></div>' : ''}
        </div>`;
      }).join('')
    : '<div class="text-center text-muted py-3 small">ไม่มีการแจ้งเตือน</div>';
}

function clickNotif(id, action, ref) {
  // Mark as read
  readNotifIds.add(id);
  sessionStorage.setItem('readNotifs', JSON.stringify([...readNotifIds]));
  renderNotificationBell();

  // ปิด dropdown
  document.getElementById('notifDropdown').classList.remove('show');

  // Navigate
  navigateTo(action);
  if (action === 'po') {
    setTimeout(() => editPO(ref), 400);
  } else if (action === 'repairs') {
    setTimeout(() => editRepair(ref), 400);
  }
}

function markAllRead() {
  allNotifications.forEach(n => readNotifIds.add(n.id));
  sessionStorage.setItem('readNotifs', JSON.stringify([...readNotifIds]));
  renderNotificationBell();
}

function promptSendToLine(type, id) {
  // เช็คก่อนว่าเคยส่งหรือยัง
  const checkFn = type === 'repair' ? 'sendRepairToLine' : 'sendPOToLine';
  
  Swal.fire({
    title            : 'ส่งแจ้งเข้า Line?',
    text             : `ต้องการส่งขออนุมัติ ${id} เข้า Line กลุ่มหรือไม่?`,
    icon             : 'question',
    showDenyButton   : true,
    showCancelButton : true,
    confirmButtonText: '📲 ส่ง Line (อัตโนมัติ)',
    denyButtonText   : '🔗 แชร์เข้า Line',
    cancelButtonText : 'ไม่ส่ง',
    confirmButtonColor: '#3B82F6',
    denyButtonColor  : '#06C755',
    cancelButtonColor: '#6B7280'
  }).then(r => {
    if (r.isDenied) {
      if (type === 'repair') {
        shareRepairToLine(id);
      } else {
        sharePOToLine(id);
      }
      return;
    }
    if (!r.isConfirmed) return;
    showLoading('กำลังส่ง Line...');
    google.script.run
      .withSuccessHandler(res => {
        Swal.close();

        // กรณีเคยส่งไปแล้ว
        if (res.alreadySent) {
          const sentDate = res.sentAt
            ? new Date(res.sentAt).toLocaleString('th-TH')
            : 'ก่อนหน้านี้';

          Swal.fire({
            icon             : 'warning',
            title            : 'เคยส่งไปแล้ว',
            html             : `<div style="font-size:14px">
                                  <b>${id}</b> ถูกส่ง Line ไปแล้วเมื่อ<br>
                                  <span style="color:#d97706">${sentDate}</span><br><br>
                                  ต้องการส่งซ้ำอีกครั้งหรือไม่?
                                </div>`,
            showDenyButton   : true,
            showCancelButton : true,
            confirmButtonText: '📲 ส่งซ้ำ',
            denyButtonText   : '🔗 แชร์เข้า Line',
            cancelButtonText : 'ยกเลิก',
            confirmButtonColor: '#d97706',
            denyButtonColor  : '#06C755',
            cancelButtonColor: '#6B7280'
          }).then(r2 => {
            if (r2.isDenied) {
              if (type === 'repair') {
                shareRepairToLine(id);
              } else {
                sharePOToLine(id);
              }
              return;
            }
            if (!r2.isConfirmed) return;
            // force ส่งซ้ำ
            showLoading('กำลังส่ง Line...');
            const forceFn = type === 'repair'
              ? 'forceSendRepairToLine'
              : 'forceSendPOToLine';
            google.script.run
              .withSuccessHandler(res2 => {
                Swal.close();
                showToast(
                  res2.success ? 'success' : 'error',
                  res2.success ? 'ส่ง Line เรียบร้อย' : (res2.message || 'ส่งไม่สำเร็จ')
                );
              })
              .withFailureHandler(err => { Swal.close(); showToast('error', err.message); })
              [forceFn](id);
          });
          return;
        }

        showToast(
          res.success ? 'success' : 'error',
          res.success ? 'ส่ง Line เรียบร้อย' : (res.message || 'ส่งไม่สำเร็จ')
        );
      })
      .withFailureHandler(err => { Swal.close(); showToast('error', err.message); })
      [checkFn](id);
  });
}

               <span class="text-muted small">*สำหรับมือถือหรือหากต้องการเปิดหน้าเว็บแชร์ ให้กดปุ่มสีเขียวด้านล่าง</span>

function shareRepairToLine(repairNo) {
  const repair = allRepairs.find(r => r.repairNo === repairNo);
  if (!repair) {
    showToast('error', 'ไม่พบรายการซ่อม');
    return;
  }

  const text = `🔧 แจ้งซ่อมใหม่: ${repair.repairNo}\n` +
               `🚌 ทะเบียนรถ: ${repair.plate || '—'}\n` +
               `📅 วันที่แจ้ง: ${formatDate(repair.date)}\n` +
               `📊 เลขไมล์: ${repair.mileage ? Number(repair.mileage).toLocaleString() + ' กม.' : '—'}\n` +
               `👤 ผู้แจ้ง: ${repair.createdBy || '—'}\n` +
               `📋 รายการซ่อม: ${repair.repairList || '—'}`;

  executeShareToLine(text);
}

function sharePOToLine(poNo) {
  const po = allPOs.find(p => p.poNo === poNo);
  if (!po) {
    showToast('error', 'ไม่พบใบสั่งซื้อ');
    return;
  }

  showLoading('กำลังโหลดรายการสินค้า...');
  google.script.run
    .withSuccessHandler(items => {
      Swal.close();
      
      const subtotal = (items || []).reduce((s, i) => s + (parseFloat(i.amount) || 0), 0);
      let vat = 0;
      let grand = subtotal;
      const vatType = po.vatType || 'none';
      if (vatType === 'exclusive') {
        vat = subtotal * 0.07;
        grand = subtotal + vat;
      } else if (vatType === 'inclusive') {
        vat = subtotal - subtotal / 1.07;
        grand = subtotal;
      }
      
      const totalStr = grand.toLocaleString('th-TH', { minimumFractionDigits: 2 }) + ' บาท';

      let text = `📋 ขออนุมัติ PO: ${po.poNo}\n` +
                 `🏪 ร้านค้า: ${po.shopName || '—'}\n` +
                 `🚌 ทะเบียน: ${po.plate || '—'}\n` +
                 `🔧 อ้างอิงซ่อม: ${po.refRepairNo || '—'}\n` +
                 `📅 วันที่: ${formatDate(po.issueDate)}\n` +
                 `👤 ผู้ขอ: ${po.createdBy || '—'}\n` +
                 `📦 รายการสินค้า:\n`;

      if (items && items.length > 0) {
        items.forEach(i => {
          text += `- ${i.partName || '—'} (${i.qty} ${i.unit || ''})\n`;
        });
      } else {
        text += `- ไม่มีรายการสินค้า\n`;
      }

      text += `💰 ยอดรวมทั้งสิ้น: ${totalStr}`;
      
      if (po.pdfUrl) {
        text += `\n📄 ดูใบสั่งซื้อ PDF: ${po.pdfUrl}`;
      }

      executeShareToLine(text);
    })
    .withFailureHandler(err => {
      Swal.close();
      showToast('error', 'ไม่สามารถโหลดรายการสินค้าได้: ' + err.message);
    })
    .getPOItems(poNo);
}

// ── LINE MESSAGE LOGS ──
let allLineLogs = [];

function loadLineLog() {
  const tbody = document.getElementById('lineLogTableBody');
  tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-5">กำลังโหลดข้อมูล Log...</td></tr>';
  
  google.script.run.withSuccessHandler(logs => {
    allLineLogs = logs || [];
    renderLineLogTable(allLineLogs);
    calculateLineLogStats(allLineLogs);
  }).withFailureHandler(err => {
    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-5">โหลดข้อมูลผิดพลาด: ${err.message}</td></tr>`;
  }).getLineLogs();
}

function renderLineLogTable(logs) {
  const tbody = document.getElementById('lineLogTableBody');
  tbody.closest('table').classList.add('table-card-mobile');
  if (!logs.length) {
    tbody.innerHTML = '<tr><td colspan="7" data-label="" class="text-center text-muted py-4">ไม่มีประวัติ Log การส่ง LINE</td></tr>';
    return;
  }
  
  tbody.innerHTML = logs.map(l => {
    const isFree = l.costStatus.indexOf('ฟรี') > -1;
    const isPush = l.method.indexOf('Push') > -1;
    
    const costBadge = isFree
      ? `<span class="badge bg-success-light text-success"><i class="bi bi-gift me-1"></i>ฟรี (Reply)</span>`
      : `<span class="badge bg-warning-light text-warning"><i class="bi bi-currency-dollar me-1"></i>คิดเงิน (Push)</span>`;
      
    const methodBadge = isPush
      ? `<span class="badge bg-info-light text-info">Push</span>`
      : `<span class="badge bg-secondary-light text-secondary">Reply</span>`;
      
    const codeClass = String(l.code).trim() === '200' ? 'text-success fw-bold' : 'text-danger fw-bold';
    
    return `<tr>
      <td data-label="วันเวลา">${l.timestamp}</td>
      <td data-label="ประเภทคำสั่ง">${methodBadge}</td>
      <td data-label="ประเภทข้อความ"><span class="badge bg-light text-dark">${l.msgType}</span></td>
      <td data-label="ผู้รับ" style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${l.recipient}">${l.recipient}</td>
      <td data-label="ข้อความพรีวิว" style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${l.preview}">${l.preview}</td>
      <td data-label="สถานะค่าบริการ">${costBadge}</td>
      <td data-label="HTTP Code" class="text-center ${codeClass}">${l.code}</td>
    </tr>`;
  }).join('');
}

function calculateLineLogStats(logs) {
  const total = logs.length;
  const free = logs.filter(l => l.costStatus.indexOf('ฟรี') > -1).length;
  const paid = logs.filter(l => l.costStatus.indexOf('คิดเงิน') > -1).length;
  
  document.getElementById('lineLogTotalCount').textContent = total.toLocaleString();
  document.getElementById('lineLogFreeCount').textContent = free.toLocaleString();
  document.getElementById('lineLogPaidCount').textContent = paid.toLocaleString();
}

function filterLineLogs() {
  const q = document.getElementById('lineLogSearch').value.toLowerCase();
  const cost = document.getElementById('lineLogCostFilter').value;
  const method = document.getElementById('lineLogMethodFilter').value;
  
  const filtered = allLineLogs.filter(l => {
    const matchQuery = !q || 
      l.recipient.toLowerCase().includes(q) || 
      l.preview.toLowerCase().includes(q);
      
    const matchCost = !cost || l.costStatus.includes(cost);
    const matchMethod = !method || l.method.includes(method);
    
    return matchQuery && matchCost && matchMethod;
  });
  
  renderLineLogTable(filtered);
}

function confirmClearLineLogs() {
  Swal.fire({
    title: 'ยืนยันการล้างประวัติ Log?',
    text: 'ข้อมูลประวัติการส่ง LINE ทั้งหมดจะถูกลบออกจากชีทถาวร!',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#EF4444',
    cancelButtonColor: '#6B7280',
    confirmButtonText: 'ใช่, ลบทั้งหมด!',
    cancelButtonText: 'ยกเลิก'
  }).then((result) => {
    if (result.isConfirmed) {
      Swal.fire({
        title: 'กำลังลบข้อมูล...',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });
      
      google.script.run.withSuccessHandler(res => {
        Swal.close();
        if (res.success) {
          showToast('success', 'ล้างประวัติ Log เรียบร้อย');
          loadLineLog();
        } else {
          showToast('error', res.message || 'เกิดข้อผิดพลาด');
        }
      }).withFailureHandler(err => {
        Swal.close();
        showToast('error', err.message);
      }).clearLineLogs();
    }
  });
}

(function() {
  const saved = sessionStorage.getItem('currentUser');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      initApp();
    } catch(e) {
      sessionStorage.removeItem('currentUser');
    }
  }
})();
